<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f06f22">
  <title>Sungrow E-learning</title>
  <link rel="icon" href="sungrow-elearning-icon.svg" type="image/svg+xml">

<body>
  <noscript>Cần bật JavaScript để sử dụng Sungrow E-learning.</noscript>
  <template id="portal-learner-layout">
<style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #19232d;
      --muted: #66737f;
      --line: #dce3e9;
      --orange: #f06f22;
      --orange-dark: #c65311;
      --blue: #1268a9;
      --green: #198754;
      --red: #c23128;
      --soft: #f6f8fa;
      --shadow: 0 10px 28px rgba(32, 46, 62, 0.07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
    }

    button, input { font: inherit; }
    [hidden] { display: none !important; }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      width: min(1180px, calc(100% - 32px));
      min-height: 82px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      padding: 12px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 0;
    }

    .brand-logo {
      width: 154px;
      height: auto;
      flex: 0 0 auto;
      display: block;
    }

    .brand-copy {
      min-width: 0;
      border-left: 1px solid var(--line);
      padding-left: 20px;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: 19px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .timer {
      min-width: 136px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid #cfdae4;
      border-radius: 8px;
      background: #edf4f9;
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .timer-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
    }

    .timer.warning .timer-dot { background: var(--red); }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .login-panel {
      max-width: 560px;
      margin: 54px auto 0;
      padding: 34px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .intro {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #43515e;
      font-size: 13px;
      font-weight: 700;
    }

    input[type="email"],
    input[type="text"] {
      width: 100%;
      min-height: 48px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 11px 13px;
      outline: none;
    }

    input[type="email"]:focus,
    input[type="text"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(18, 104, 169, 0.14);
    }

    .button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      background: var(--orange);
      color: #fff;
      cursor: pointer;
      font-weight: 800;
    }

    .button:hover { background: var(--orange-dark); }
    .button:disabled { cursor: wait; opacity: 0.58; }
    .login-panel .button { width: 100%; margin-top: 14px; }
    #loginForm { margin-top: 24px; }

    .login-message {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--red);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }

    .registration-link {
      width: 100%;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #fff;
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .registration-link:hover {
      border-color: var(--blue);
      background: #f3f8fc;
    }

    .registration-form {
      margin-top: 0;
    }

    .registration-grid {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .registration-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-top: 2px;
    }

    .registration-actions .button {
      margin-top: 0;
    }

    .otp-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 10px;
      align-items: end;
    }

    .otp-field .button {
      min-height: 48px;
      margin-top: 0;
      padding-inline: 14px;
      white-space: nowrap;
    }

    #registrationOtp {
      letter-spacing: 6px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }

    .button.secondary-button {
      border: 1px solid #cbd5df;
      background: #fff;
      color: var(--ink);
    }

    .button.secondary-button:hover {
      background: #f3f6f8;
    }

    .button.result-unavailable:disabled {
      cursor: not-allowed;
      border-color: #dbe3ea;
      background: #f3f6f8;
      color: var(--muted);
      opacity: 1;
    }

    .registration-message.success {
      color: var(--green);
    }

    .security-note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .admin-link-button {
      color: var(--ink);
    }

    .course-view {
      display: grid;
      gap: 22px;
    }

    .course-view[hidden] { display: none; }

    .course-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 24px;
    }

    .course-user {
      min-width: 0;
    }

    .course-user-name {
      margin: 0;
      color: var(--ink);
      font-size: 18px;
      font-weight: 800;
    }

    .course-user-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .course-header .button {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 8px 15px;
    }

    .course-heading {
      margin-top: 4px;
    }

    .course-heading .intro {
      max-width: 720px;
      margin-bottom: 0;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .course-card {
      display: flex;
      min-width: 0;
      min-height: 260px;
      flex-direction: column;
      border: 1px solid var(--line);
      border-top: 4px solid var(--orange);
      border-radius: 8px;
      background: #fff;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .course-code {
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .course-card h3 {
      margin: 9px 0 0;
      font-size: 19px;
      line-height: 1.35;
    }

    .course-description {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .course-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .course-fact span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .course-fact strong {
      display: block;
      margin-top: 4px;
      font-size: 13px;
    }

    .course-card .button {
      width: 100%;
      margin-top: 0;
    }

    .course-actions {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .course-card.unavailable {
      border-top-color: #9aa8b5;
    }

    .course-card.unavailable .course-code {
      color: var(--muted);
    }

    .course-empty {
      grid-column: 1 / -1;
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .candidate-bar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--line);
      box-shadow: var(--shadow);
    }

    .candidate-item {
      min-width: 0;
      background: #fff;
      padding: 14px 16px;
    }

    .candidate-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .candidate-value {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quiz-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .progress {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfe6ec;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--orange);
      transition: width 180ms ease;
    }

    .answered {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .exam-layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .question-nav-panel {
      position: sticky;
      top: 92px;
      padding: 18px;
    }

    .question-nav-panel h2 {
      margin: 0;
      font-size: 15px;
    }

    .question-nav-summary {
      margin: 6px 0 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .question-nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 34px);
      gap: 8px;
    }

    .question-nav-button {
      width: 34px;
      height: 34px;
      border: 1px solid #cad5df;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .question-nav-button:hover {
      border-color: var(--orange);
      color: #c94f0c;
    }

    .question-nav-button.answered-question {
      border-color: var(--orange);
      background: var(--orange);
      color: #fff;
    }

    .question-nav-legend {
      display: grid;
      gap: 8px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 11px;
    }

    .question-nav-legend span {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border: 1px solid #cad5df;
      border-radius: 3px;
      background: #fff;
    }

    .legend-swatch.answered-swatch {
      border-color: var(--orange);
      background: var(--orange);
    }

    .exam-question-column { min-width: 0; }

    .questions {
      display: grid;
      gap: 14px;
    }

    .question-card {
      padding: 20px;
      scroll-margin-top: 92px;
    }

    .question-head {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 13px;
      align-items: start;
    }

    .question-number {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #1d2731;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .question-text {
      padding-top: 6px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
    }

    .options {
      display: grid;
      gap: 9px;
      margin-top: 16px;
    }

    .option {
      min-height: 54px;
      display: grid;
      grid-template-columns: 20px 34px minmax(0, 1fr);
      gap: 11px;
      align-items: center;
      border: 1px solid #d8e0e7;
      border-radius: 8px;
      background: #fff;
      padding: 11px 14px;
      cursor: pointer;
    }

    .option:hover { border-color: #aebdca; background: #f9fbfc; }
    .option:has(input:checked) { border-color: #6f9fd0; background: #f1f7fc; }
    .option input { width: 17px; height: 17px; margin: 0; }

    .option-letter {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: #eef2f5;
      color: #394754;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
    }

    .option:has(input:checked) .option-letter {
      background: var(--blue);
      color: #fff;
    }

    .option-text {
      min-width: 0;
      color: #34414d;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .submit-bar {
      position: sticky;
      bottom: 0;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
      padding: 14px 0;
      background: rgba(244, 246, 248, 0.94);
      backdrop-filter: blur(8px);
    }

    .result-layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .history-panel { padding: 18px; }
    .history-title { margin: 0 0 14px; font-size: 15px; }
    .history-list { display: grid; gap: 8px; }

    .history-item {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--ink);
      padding: 12px;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .history-item:hover { border-color: #9fb2c2; background: #fff; }
    .history-item.active {
      border-color: var(--orange);
      background: #fff7f1;
      box-shadow: inset 3px 0 0 var(--orange);
    }
    .history-item:disabled { cursor: wait; opacity: 0.65; }

    .history-score { font-size: 13px; font-weight: 800; }
    .history-time { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .pass-text { color: var(--green); }
    .failed-text { color: var(--red); }

    .result-main { display: grid; gap: 14px; }
    .result-summary { padding: 24px; }

    .result-user {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .result-user strong { color: var(--ink); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-top: 22px;
    }

    .metric {
      min-width: 0;
      padding: 0 22px;
      border-right: 1px solid var(--line);
    }

    .metric:first-child { padding-left: 0; }
    .metric:last-child { padding-right: 0; border-right: 0; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 7px; font-size: 25px; font-weight: 700; }
    .metric-value small { font-size: 13px; font-weight: 600; }

    .analysis-panel {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 34px;
      align-items: center;
      padding: 26px;
    }

    .score-ring {
      --score: 0%;
      width: 174px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: 0 auto;
      border-radius: 50%;
      background: conic-gradient(var(--orange) var(--score), #edf0f2 0);
      position: relative;
    }

    .score-ring::after {
      content: "";
      position: absolute;
      width: 142px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
    }

    .score-ring-copy {
      z-index: 1;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .score-ring-copy strong {
      display: block;
      margin-top: 6px;
      color: #45515c;
      font-size: 31px;
    }

    .analysis-copy h3 { margin: 0 0 10px; font-size: 18px; }
    .analysis-copy p { margin: 6px 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .analysis-copy .result-callout { color: var(--ink); font-size: 16px; font-weight: 800; }

    .category-performance {
      display: grid;
      gap: 13px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .category-row { min-width: 0; }

    .category-row-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }

    .category-name {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .category-swatch {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 2px;
    }

    .category-score {
      flex: 0 0 auto;
      color: var(--muted);
    }

    .category-bar {
      height: 8px;
      overflow: hidden;
      border-radius: 4px;
      background: #e8edf1;
    }

    .category-bar-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
    }

    .wrong-review-panel { padding: 24px; }
    .wrong-review-panel h3 { margin: 0; font-size: 18px; }
    .wrong-review-intro { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .wrong-review-list { margin-top: 18px; border-top: 1px solid var(--line); }

    .wrong-review-item {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .wrong-review-number {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 6px;
      background: #fff0e7;
      color: #c94f0c;
      font-weight: 800;
    }

    .wrong-review-question { color: var(--ink); font-size: 14px; font-weight: 700; line-height: 1.5; }
    .wrong-review-answer { margin-top: 7px; color: var(--red); font-size: 13px; line-height: 1.5; }

    .result-actions {
      display: flex;
      justify-content: flex-end;
      padding: 4px 0 20px;
    }

    .back-to-top {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 50;
      width: 44px;
      height: 44px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 8px 24px rgba(17, 26, 35, 0.16);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .back-to-top:hover {
      border-color: var(--orange);
      color: #c94f0c;
    }

    .tab-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(17, 26, 35, 0.76);
    }

    .tab-dialog {
      width: min(460px, 100%);
      border-radius: 8px;
      background: #fff;
      padding: 28px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    .tab-dialog h2 { font-size: 21px; }
    .tab-countdown { margin: 16px 0 0; color: var(--red); font-size: 34px; font-weight: 800; }

    .violation-count {
      color: var(--orange-dark);
      font-weight: 800;
    }

    @media (max-width: 850px) {
      .brand-logo { width: 122px; }
      h1 { font-size: 15px; }
      .candidate-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .course-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .exam-layout { grid-template-columns: 1fr; }
      .question-nav-panel { position: static; }
      .question-nav-grid { grid-template-columns: repeat(auto-fit, minmax(34px, 1fr)); }
      .question-nav-button { width: 100%; }
      .result-layout { grid-template-columns: 1fr; }

/* Shared Liquid Glass surfaces for the learner and administrator shells. */
body.v5 {
  --sg-ink:#172b38;
  --sg-muted:#344f61;
  --sg-brand:#ff7900;
  --sg-action:#993d00;
  --sg-glass-base:#f3f8fb;
  --sg-glass-fill:#f5fbff8f;
  --sg-glass-nav:#f1faffaa;
  --sg-glass-popover:#f5fbffeb;
  --sg-glass-border:#ffffffed;
  --sg-glass-shadow:inset 0 1px 0 #fffffff2,0 2px 6px #23435e0b,0 12px 28px #23435e13;
  --sg-glass-radius:22px;
  --sg-glass-blur:14px;
  --sg-popover-blur:22px;
  --sg-input:#f6fafc;
  --sg-line:#c7d8e2;
  --sg-table-head:#deedf5;
  --sg-control-height:40px;
  --sg-control-radius:12px;
  --sg-type-compact:.8125rem;
  --sg-type-detail:.875rem;
  --sg-type-body:1rem;
  --sg-data-font:var(--sg-type-detail);
  --sg-page-background:
    radial-gradient(ellipse at 18% 8%,#c4def2,transparent 58%),
    radial-gradient(ellipse at 85% 2%,#ffe5cf,transparent 45%),
    radial-gradient(ellipse at 87% 92%,#bdddec,transparent 64%),
    #e8f2f8;
  color:var(--sg-ink);
  background:var(--sg-page-background);
}
body.v5.v4 :is(
  .v4-sidebar,.v4-mobile,.v4-focusbar,.panel,.card,.v2-task,.course-card,
  .v2-exam-tools,.catalog-toolbar,.exam-question-column,.v5-history-panel,
  .sg-result-head,.v2-metrics>div,.v2-banner,.learn-tools,.account-card
){
  background:var(--sg-glass-base);
  border-color:#d0dae7;
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  body.v5.v4 :is(
    .v4-sidebar,.v4-mobile,.v4-focusbar,.panel,.card,.v2-task,.course-card,
    .v2-exam-tools,.catalog-toolbar,.exam-question-column,.v5-history-panel,
    .sg-result-head,.v2-metrics>div,.v2-banner,.learn-tools,.account-card
  ){
    background:var(--sg-glass-fill);
    border-color:var(--sg-glass-border);
    box-shadow:var(--sg-glass-shadow);
    -webkit-backdrop-filter:blur(var(--sg-glass-blur)) saturate(125%);
    backdrop-filter:blur(var(--sg-glass-blur)) saturate(125%);
  }
  body.v5.v4 :is(.v4-sidebar,.v4-mobile,.v4-focusbar){background:var(--sg-glass-nav)}
  body.v5.v4 :is(.v4-scroll,.exam-question-column) .question-card{
    background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  body.v5.v4 dialog:not(.sg-certificate-dialog){
    background:var(--sg-glass-popover);
    border-color:#fff;
    box-shadow:var(--sg-glass-shadow),0 18px 60px #192c4a28;
    -webkit-backdrop-filter:blur(var(--sg-popover-blur)) saturate(125%);
    backdrop-filter:blur(var(--sg-popover-blur)) saturate(125%);
  }
}
@media(prefers-reduced-transparency:reduce){
  body.v5{
    --sg-glass-fill:#f8fafc;
    --sg-glass-nav:var(--sg-glass-base);
    --sg-glass-popover:var(--sg-glass-base);
    --sg-glass-blur:0px;
    --sg-popover-blur:0px;
    --sg-glass-border:#d0dae7;
    --sg-glass-shadow:0 2px 5px #283d5b13;
    --sg-page-background:#edf2fa;
    background:var(--sg-page-background);
  }
  body.v5.v4 :is(.v4-sidebar,.v4-mobile,.v4-focusbar,dialog:not(.sg-certificate-dialog)){background:#f8fafc}
  body.v5.v4 :is(.v4-sidebar,.v4-mobile,.v4-focusbar,.panel,.card,.v2-task,.course-card,.v2-exam-tools,.catalog-toolbar,.exam-question-column,.v5-history-panel,.sg-result-head,.v2-metrics>div,.v2-banner,.learn-tools,.account-card,dialog){
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
}
body.v5.v4 :is(.panel,.card,.course-card,.v2-task,.v2-metrics>div,.v2-banner,.sg-result-head,.account-card,dialog:not(.sg-certificate-dialog)){
  border-radius:var(--sg-glass-radius);
}
body.v5.v4 :is(h1,h2,h3,legend){color:var(--sg-ink)}
body.v5.v4 :is(.muted,.account-intro,.v4-company){color:var(--sg-muted)}
body.v5.v4 :is(input,select,textarea){font-size:var(--sg-type-body)}
body.v5.v4 .v2-metrics .v4-stat-label{white-space:normal}
@media(max-width:720px){
  body.v5.v4 :is(.filters,.catalog-toolbar,.v2-exam-tools) :is(input,select,textarea){
    font-size:var(--sg-type-body);
  }
}
body.v5.v4 :is(.v3-tabs,.tabs){
  padding:3px;
  border:1px solid var(--sg-line);
  border-radius:var(--sg-control-radius);
  background:var(--sg-glass-base);
}
@supports (backdrop-filter:blur(1px)) {
  body.v5.v4 :is(.v3-tabs,.tabs){background:var(--sg-glass-nav)}
}
body.v5.v4 :is(.v3-tabs,.tabs) [aria-selected=true]{
  background:#fff6ed;
  color:var(--sg-action);
  box-shadow:inset 0 -2px var(--sg-brand);
}
body.v5.v4 :is(input:not([type=checkbox],[type=radio],[type=range],[type=file]),select,textarea){
  background-color:var(--sg-input);
  color:var(--sg-ink);
  border-color:var(--sg-line);
  border-radius:var(--sg-control-radius);
}
body.v5.v4 :is(.filters,.catalog-toolbar,.v2-exam-tools) :is(input,select,button:not(.v4-toggle)){
  min-block-size:var(--sg-control-height);
  font-size:var(--sg-data-font);
  border-radius:var(--sg-control-radius);
}
body.v5.v4 :is(.sg-table-scroll,.v5-panel-scroll,.v4-results,.overview-grid) table{
  font-size:var(--sg-data-font);
  line-height:1.45;
}
body.v5.v4 :is(.sg-table-scroll,.v5-panel-scroll,.v4-results,.overview-grid) thead,
body.v5.v4 :is(.sg-table-scroll,.v5-panel-scroll,.v4-results,.overview-grid) thead th{

  background:var(--sg-glass-base);

html[data-solid-glass] body.v5{
  --sg-glass-fill:var(--sg-glass-base);
  --sg-glass-nav:var(--sg-glass-base);
  --sg-glass-popover:var(--sg-glass-base);
  --sg-glass-border:var(--sg-line);
  --sg-glass-blur:0px;
  --sg-popover-blur:0px;
  --sg-page-background:#e8f2f8;

}
@supports (backdrop-filter:blur(1px)) {

@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6OYUZKkLfkh2FdENb6P24ccaVbE7EiAhnyIerYy-0fB_QTVfRPnJ_3eCzJG-zrowwIw/exec";
    const ACTIVE_SESSION_KEY = "mgrl_active_attempt_v2";
    const TAB_GRACE_SECONDS = 60;
    const TAB_WARNING_THRESHOLD = 10;
    const INACTIVITY_TRIGGER_SECONDS = 5 * 60;
    const INACTIVITY_GRACE_SECONDS = 60;
    let registrationRedirectTimer = null;
    let registrationOtpSent = false;
    let confirmedPageReload = false;
    let registrationLoading = false;
    let otpCooldownTimer = null;
    let otpCooldownRemaining = 0;

    const state = {
      authEpoch:0,
      active: false,
      submitting: false,
      token: "",
      email: "",
      deviceId: getDeviceId(),
      participant: null,
      courses: [],
      course: null,
      questions: [],
      answers: {},
      history: [],
      attemptNumber: 0,
      maxAttempts: 2,
      expiresAt: "",
      startedAt: "",
      hiddenAt: 0,
      attentionReason: "",
      lastInteractionAt: 0,
      tabViolations: 0,
      tabWarningShown: false,
      timerId: null,
      tabTimerId: null,
      inactivityTimerId: null,
      progressSaveTimerId: null,
      progressSyncTimerId: null,
      progressSaveInFlight: false,
      progressSavePending: false,
      lastProgressSnapshot: "",
      submitRetryTimerId: null,
      submitRetryCount: 0,
      pendingSubmission: null,
      submitFailureNotified: false
    };

    const loginView = document.getElementById("loginView");
    const courseView = document.getElementById("courseView");
    const examView = document.getElementById("examView");
    const resultView = document.getElementById("resultView");
    const loginContent = document.getElementById("loginContent");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const loginButton = document.getElementById("loginButton");
    const courseUser = document.getElementById("courseUser");
    const courseGrid = document.getElementById("courseGrid");
    const courseMessage = document.getElementById("courseMessage");
    const logoutButton = document.getElementById("logoutButton");
    const registrationToggleButton = document.getElementById("registrationToggleButton");
    const registrationForm = document.getElementById("registrationForm");
    const registrationName = document.getElementById("registrationName");
    const registrationCompany = document.getElementById("registrationCompany");
    const registrationEmail = document.getElementById("registrationEmail");
    const registrationOtp = document.getElementById("registrationOtp");
    const registrationOtpButton = document.getElementById("registrationOtpButton");
    const registrationBackButton = document.getElementById("registrationBackButton");
    const registrationSubmitButton = document.getElementById("registrationSubmitButton");
    const registrationMessage = document.getElementById("registrationMessage");
    const loginMessage = document.getElementById("loginMessage");
    const timer = document.getElementById("timer");
    const timerText = document.getElementById("timerText");
    const candidateBar = document.getElementById("candidateBar");
    const quizForm = document.getElementById("quizForm");
    const submitButton = document.getElementById("submitButton");
    const answeredCount = document.getElementById("answeredCount");
    const progressFill = document.getElementById("progressFill");
    const questionNavSummary = document.getElementById("questionNavSummary");
    const questionNavGrid = document.getElementById("questionNavGrid");
    const backToTopButton = document.getElementById("backToTopButton");
    const tabOverlay = document.getElementById("tabOverlay");
    const tabCountdown = document.getElementById("tabCountdown");
    const attentionEyebrow = document.getElementById("attentionEyebrow");
    const attentionTitle = document.getElementById("attentionTitle");
    const attentionMessage = document.getElementById("attentionMessage");
    const violationWarningOverlay = document.getElementById("violationWarningOverlay");
    const violationWarningCount = document.getElementById("violationWarningCount");
    const violationAcknowledgeButton = document.getElementById("violationAcknowledgeButton");
    function getDeviceId() {
      const key='sungrow_browser_id_v3';
      let id=localStorage.getItem(key);if(!id){id=crypto.randomUUID();localStorage.setItem(key,id);}return id;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(totalSeconds) {
      const safe = Math.max(0, Math.floor(totalSeconds));
      const minutes = Math.floor(safe / 60).toString().padStart(2, "0");
      const seconds = (safe % 60).toString().padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function formatDuration(totalSeconds) {
      const safe = Math.max(0, Math.floor(totalSeconds));
      const minutes = Math.floor(safe / 60);
      const seconds = safe % 60;
      return `${minutes} phút ${seconds} giây`;
    }

    function wait(milliseconds) {
      return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
    }

    async function callApi(action,payload={}) { return requestParticipant(action,payload); }

    function setLoginLoading(isLoading) {
      loginButton.disabled = isLoading;
      loginButton.setAttribute('aria-busy', String(isLoading));
      loginButton.textContent = isLoading ? "Đang xác thực..." : "Đăng nhập";
    }

    async function requestParticipant(action,payload){
      const epoch=state.authEpoch;
      try{return await Portal.request(APPS_SCRIPT_URL,action,payload);}catch(error){
        if(epoch===state.authEpoch&&['listCourses','startAttempt','resumeAttempt','saveAttemptProgress','submitAttempt','getLatestResult','getAttemptResult','reportAttention','learningHome','updateLearningProfile','completeLearningLesson'].includes(action)&&Portal.isAuthError(error))handleParticipantAuthLoss(error);
        throw error;
      }
    }

    function saveSession() {
      if (!state.active) return;
      localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify({
        token: state.token,
        email: state.email,
        deviceId: state.deviceId,
        participant: state.participant,
        course: state.course,
        questions: state.questions,
        answers: state.answers,
        history: state.history,
        attemptNumber: state.attemptNumber,
        maxAttempts: state.maxAttempts,
        expiresAt: state.expiresAt,
        startedAt: state.startedAt,
        hiddenAt: state.hiddenAt,
        tabViolations: state.tabViolations,
        tabWarningShown: state.tabWarningShown,
        pendingSubmission: state.pendingSubmission,
        submitRetryCount: state.submitRetryCount,
        answerVersion: state.answerVersion
      }));
    }

    function clearSession() {
      const raw=localStorage.getItem(ACTIVE_SESSION_KEY);
      if(!raw)return;
      try{const saved=JSON.parse(raw);if(state.email&&saved.email!==state.email)return;}catch{return;}
      localStorage.removeItem(ACTIVE_SESSION_KEY);
    }

    function applyAttempt(data, localAnswers = {}, localMeta = {}) {
      state.active = true;
      state.submitting = false;
      state.token = data.attemptToken;
      state.email = data.participant.email;
      state.participant = data.participant;
      state.course = data.course;
      state.questions = data.questions;
      state.answers = {
        ...(data.savedAnswers || {}),
        ...localAnswers
      };
      state.history = data.history || [];
      state.attemptNumber = data.attemptNumber;
      state.maxAttempts = data.maxAttempts;
      state.expiresAt = data.expiresAt;
      state.startedAt = data.startedAt;
      state.answerVersion = Math.max(Number(data.answerVersion || 0), Number(localMeta.answerVersion || 0));
      state.serverOffset = Date.parse(data.serverNow || new Date().toISOString()) - Date.now();
      state.hiddenAt = 0;
      state.attentionReason = "";
      state.lastInteractionAt = Date.now();
      state.tabViolations = Math.max(
        Number(data.tabViolations || 0),
        Number(localMeta.tabViolations || 0)
      );
      state.tabWarningShown = Boolean(localMeta.tabWarningShown);
      state.lastProgressSnapshot = "";
      clearTimeout(state.submitRetryTimerId);
      state.submitRetryTimerId = null;
      state.submitRetryCount = 0;
      state.pendingSubmission = null;
      state.submitFailureNotified = false;
      saveSession();
      renderExam();
    }

    async function authenticateParticipant(email,restore=false) {
      const epoch=++state.authEpoch;
      const data = await callApi(restore?"listCourses":"loginParticipant", restore?{deviceId:state.deviceId}:{
        email,
        password: document.getElementById("learnerPassword").value,
        remember: document.getElementById("rememberLogin").checked,
        confirmTransfer: document.getElementById("confirmTransfer").checked,
        otp: document.getElementById("learnerOtp").value.trim(),
        deviceId: state.deviceId
      });
      if(epoch!==state.authEpoch)return false;
      if(data.requiresPasswordChange){
        showLoginForm();
        document.getElementById('learnerPassword').value='';
        document.getElementById('passwordSetupToggle').click();
        document.getElementById('setupMessage').textContent=data.message;
        document.getElementById('setupSendOtp').focus();
        return false;
      }
      if(data.requiresDeviceOtp){Portal.showView('loginView');document.getElementById('deviceVerification').hidden=false;loginMessage.textContent=data.message;return false;}
      document.getElementById('learnerPassword').value='';document.getElementById('learnerOtp').value='';
      state.email = data.participant.email;
      state.participant = data.participant;
      state.courses = Array.isArray(data.courses) ? data.courses : [];
      if (typeof data.learningReady === 'boolean') {
        state.learningReady=data.learningReady;
        document.getElementById('learningPortal').hidden=!state.learningReady;
        document.getElementById('academyNavigation').hidden=!state.learningReady;
      }
      const pendingRaw=localStorage.getItem(ACTIVE_SESSION_KEY);
      if(pendingRaw){
        let saved;try{saved=JSON.parse(pendingRaw);}catch{throw new Error('Bài làm lưu trên trình duyệt không đọc được. Dữ liệu chưa bị xóa; vui lòng liên hệ quản trị.');}
        if(saved.email===state.email){
          if(!saved.token)throw new Error('Bản lưu bài thi thiếu mã lượt. Dữ liệu chưa bị xóa; vui lòng liên hệ quản trị.');
          Portal.loading(saved.pendingSubmission?'Đang xác nhận lại bài đã gửi…':'Đang xác nhận kết thúc bài thi trước do tải lại trang…');
          const result=await callApi("submitAttempt",{email:state.email,deviceId:state.deviceId,attemptToken:saved.token,
            answers:saved.answers||{},answerVersion:Number(saved.answerVersion||0)+1,
            autoSubmitted:saved.pendingSubmission?!!saved.pendingSubmission.autoSubmitted:true,
            terminationReason:saved.pendingSubmission?.terminationReason||"PAGE_RELOAD",tabViolations:Number(saved.tabViolations||0)});
          if(epoch!==state.authEpoch)return false;
          clearSession();state.course=result.course;renderResult(result);return true;
        }
      }
      renderCourseSelection();
      if (state.learningReady) window.LearningPortal?.open();
      return true;
    }

    function renderCourseSelection() {
      Portal.showView('courseView');
      loginView.hidden = true;
      examView.hidden = true;
      resultView.hidden = true;
      resultView.innerHTML = "";
      courseView.hidden = false;
      timer.hidden = true;
      courseMessage.textContent = "";

      courseUser.innerHTML = `
        <p class="course-user-name">${escapeHtml(state.participant.name)}</p>
        <div class="course-user-meta">
          <span>${escapeHtml(state.participant.company)}</span>
          <span>${escapeHtml(state.participant.email)}</span>
        </div>
      `;

      courseGrid.innerHTML = state.courses.length
          ? state.courses.map((course, position) => {
              const remaining = Math.max(0, Number(course.remainingAttempts || 0));
              const canStart = Boolean(course.canStart);
              const labels = {OPEN:"Đang mở",UPCOMING:"Chưa đến giờ",CLOSED:"Đã đóng",INVALID:"Lịch chưa hợp lệ",DISABLED:"Tạm khóa"};
              const dateLabel = value => value ? new Date(value).toLocaleString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",dateStyle:"short",timeStyle:"short"}) : "Không giới hạn";
              const hasResult = Boolean(
                course.hasResult ||
                course.latestResult ||
                Number(course.attemptsUsed || 0) > 0
              );
            return `
              <article class="course-card${canStart ? "" : " unavailable"}" data-window="${escapeHtml(course.windowStatus)}" data-opens="${escapeHtml(course.opensAt || '')}" data-closes="${escapeHtml(course.closesAt || '')}" data-position="${position}">
                <div class="exam-card-heading"><h3>${escapeHtml(course.title)}</h3>
                  <span class="exam-state" data-state="${escapeHtml(course.windowStatus)}">${escapeHtml(labels[course.windowStatus] || "Chưa mở")}</span>
                </div>
                <p class="v2-exam-meta">${escapeHtml(course.questionCount)} câu · ${escapeHtml(course.durationMinutes)} phút · Đạt từ ${escapeHtml(course.passPercent)}% · Còn ${escapeHtml(remaining)}/${escapeHtml(course.maxAttempts)} lượt</p>
                <div class="course-window" data-state="${escapeHtml(course.windowStatus)}">
                  <span><b>Mở</b> ${escapeHtml(dateLabel(course.opensAt))}</span>
                  <span><b>Hạn nộp</b> ${escapeHtml(dateLabel(course.closesAt))}</span>
                </div>
                <div class="course-actions">
                  <button
                    class="button"
                    type="button"
                    data-start-course-id="${escapeHtml(course.id)}"
                    ${canStart ? "" : "disabled"}
                  >${canStart ? "Bắt đầu kiểm tra" : course.windowStatus !== "OPEN" ? escapeHtml(labels[course.windowStatus] || "Chưa mở") : "Đã hết 2 lượt"}</button>
                  ${hasResult ? `
                    <button
                      class="button secondary-button"
                      type="button"
                      data-result-course-id="${escapeHtml(course.id)}"
                    >Xem kết quả mới nhất</button>
                  ` : `
                    <button
                      class="button secondary-button result-unavailable"
                      type="button"
                      disabled
                      aria-disabled="true"
                    >Chưa có kết quả</button>
                  `}
                </div>
              </article>
            `;
          }).join("")
        : '<div class="panel course-empty">Hiện chưa có bài kiểm tra nào được mở.</div>';
      window.updateExamFilters?.();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderCandidate() {
      const items = [
        ["Người làm bài", state.participant.name],
        ["Công ty", state.participant.company],
        ["Email", state.participant.email],
        ["Bài kiểm tra", state.course ? state.course.title : ""],
        ["Lượt thi", `${state.attemptNumber}/${state.maxAttempts}`]
      ];
      candidateBar.innerHTML = items.map(([label, value]) => `
        <div class="candidate-item">
          <span class="candidate-label">${escapeHtml(label)}</span>
          <span class="candidate-value" title="${escapeHtml(value)}">${escapeHtml(value)}</span>
        </div>
      `).join("");
    }

    function renderExam() {
      Portal.showView('examView');
      loginView.hidden = true;
      courseView.hidden = true;
      resultView.hidden = true;
      examView.hidden = false;
      timer.hidden = false;
      submitButton.disabled = false;
      submitButton.textContent = "Nộp bài";
      renderCandidate();
      quizForm.innerHTML = state.questions.map((question, questionIndex) => `
        <section id="question-${questionIndex + 1}" class="panel question-card" ${questionIndex ? 'hidden' : ''}>
          <fieldset class="v3-question"><legend>Câu ${questionIndex + 1}. ${escapeHtml(question.question)}</legend>
          ${question.multiple ? '<p>Chọn tất cả đáp án đúng</p>' : ''}
          ${question.diagram ? window.v3DiagramButton : ''}
          <div class="options">
            ${question.options.map((option) => `
              <label class="option">
                <input
                  type="${question.multiple ? 'checkbox' : 'radio'}"
                  name="${escapeHtml(question.id)}"
                  value="${escapeHtml(option.key)}"
                  ${(question.multiple ? (state.answers[question.id] || []).includes(option.key) : state.answers[question.id] === option.key) ? "checked" : ""}
                >
                <span class="option-letter">${escapeHtml(option.key)}</span>
                <span class="option-text">${escapeHtml(option.text)}</span>
              </label>
            `).join("")}
          </div>
        </fieldset></section>
      `).join("");
      state.currentQuestion=1;
      updateProgress();
      openExamQuestion(1);
      startTimer();
      startInactivityWatcher();
      startProgressSync();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestionNavigator() {

    function openExamQuestion(number, focus=false) {
      const card=document.getElementById(`question-${number}`);
      if (!card || !state.active) return;
      const previous=document.getElementById(`question-${state.currentQuestion}`);
      if(previous) previous.hidden=true;
      state.currentQuestion=number;
      card.hidden=false;
      document.getElementById('examPosition').textContent=`Câu ${number} / ${state.questions.length}`;
      document.getElementById('previousQuestion').disabled=number===1;
      document.getElementById('nextQuestion').disabled=number===state.questions.length;
      questionNavGrid.querySelector('[aria-current]')?.removeAttribute('aria-current');
      questionNavGrid.querySelector(`[data-question-number="${number}"]`)?.setAttribute('aria-current','step');

        card.focus();

    function updateProgress() {
      const count = Object.keys(state.answers).length;
      const total = state.questions.length || 1;
      answeredCount.textContent = `${count}/${total} đã chọn`;
      questionNavSummary.textContent = `${count}/${total} câu đã chọn`;

    function remainingSeconds() {
      return Math.ceil((Date.parse(state.expiresAt) - Date.now() - (state.serverOffset || 0)) / 1000);
    }

    function startTimer() {
      clearInterval(state.timerId);
      const tick = () => {
        const remaining = remainingSeconds();
        timerText.textContent = formatTime(remaining); window.v3Announce?.(remaining);
        timer.classList.toggle("warning", remaining <= 300);
        if (remaining <= 0) {
          clearInterval(state.timerId);
          submitExam(true, "TIME_LIMIT");
        }
      };
      tick();
      state.timerId = setInterval(tick, 1000);
    }

    async function startAttempt(email, courseId) {
      const epoch=state.authEpoch;
      const pendingKey='sungrow_pending_start_v4:'+email.toLowerCase()+':'+courseId;
      let startRequestId=localStorage.getItem(pendingKey);
      if(!startRequestId){startRequestId=crypto.randomUUID();localStorage.setItem(pendingKey,startRequestId);}
      const data = await callApi("startAttempt", {
        email,
        courseId,
        startRequestId,
        deviceId: state.deviceId,
        clientTimeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Ho_Chi_Minh"
      });
      if(epoch!==state.authEpoch)return;
      // A transport timeout must retain this key: the server may have committed already.
      if(data.finished){state.course=data.course;renderResult(data);}else applyAttempt(data);
      localStorage.removeItem(pendingKey);
    }

    async function saveAttemptProgress(force = false) {
      if (!state.active || state.submitting) return;
      const epoch=state.authEpoch;
      if (state.progressSaveInFlight) {
        state.progressSavePending = true;
        return;
      }
      const snapshot = JSON.stringify(state.answers);
      if (!force && snapshot === state.lastProgressSnapshot) return;
      state.progressSaveInFlight = true;
      try {
        const data = await callApi("saveAttemptProgress", {
          attemptToken: state.token,
          email: state.email,
          deviceId: state.deviceId,
          answers: state.answers,
          answerVersion: ++state.answerVersion,
          tabViolations: state.tabViolations
        });
        if(epoch!==state.authEpoch)return;
        state.lastProgressSnapshot = snapshot;
        if (data.expiresAt) state.expiresAt = data.expiresAt;
        if (data.expired) { await submitExam(true, "TIME_LIMIT"); return; }
        if (data.finished) {
          state.active = false;
          clearSession();
          clearInterval(state.timerId);
          clearInterval(state.inactivityTimerId);
          clearInterval(state.progressSyncTimerId);
          await viewLatestResult(state.course.id);
        }
      } catch (error) {
        console.warn("Không thể lưu tiến độ bài thi:", error.message);
      } finally {
        if(epoch!==state.authEpoch)return;
        state.progressSaveInFlight = false;
        if (state.progressSavePending && state.active && !state.submitting) {
          state.progressSavePending = false;
          window.setTimeout(() => saveAttemptProgress(), 800);
        }
      }
    }

    function scheduleProgressSave() {
      clearTimeout(state.progressSaveTimerId);
      state.progressSaveTimerId = setTimeout(() => {
        saveAttemptProgress();
      }, 12000 + Math.random() * 6000);
    }

    function startProgressSync() {
      clearInterval(state.progressSyncTimerId);
      state.progressSyncTimerId = setInterval(() => {
        saveAttemptProgress();
      }, 45000 + Math.random() * 15000);
    }

    function startOtpCooldown(seconds) {

      updateOtpButton();
      otpCooldownTimer = window.setInterval(() => {
        otpCooldownRemaining -= 1;
        if (otpCooldownRemaining <= 0) {
          window.clearInterval(otpCooldownTimer);

    async function sendRegistrationOtp() {
      const fields = [registrationName, registrationCompany, registrationEmail];
      const invalidField = fields.find((field) => !field.checkValidity());
      if (invalidField) {
        invalidField.reportValidity();
        invalidField.focus();
        return;
      }

      registrationMessage.textContent = "";
      registrationMessage.classList.remove("success");
      setRegistrationLoading(true);
      try {
        const data = await callApi("sendRegistrationOtp", {
          name: registrationName.value.trim(),
          company: registrationCompany.value.trim(),
          email: registrationEmail.value.trim()
          ,deviceId: state.deviceId
        });
        if (data.alreadyRegistered) {
          const registeredEmail = registrationEmail.value.trim();
          registrationMessage.textContent = data.message;
          registrationMessage.classList.add("success");
          emailInput.value = registeredEmail;
          window.setTimeout(() => {
            showLoginForm();
          }, 2500);
          return;
        }
        registrationOtpSent = true;
        registrationMessage.textContent = data.message;
        registrationMessage.classList.add("success");
        startOtpCooldown(data.resendAfterSeconds || 60);
        registrationOtp.focus();
      } catch (error) {
        registrationMessage.textContent = error.message;
      } finally {
        setRegistrationLoading(false);
      }
    }

    async function submitExam(autoSubmitted, terminationReason, skipConfirmation = false) {
      if (!state.active || state.submitting) return;
      const epoch=state.authEpoch;
      if (
        !autoSubmitted &&
        !skipConfirmation &&
        !window.confirm("Bạn xác nhận nộp bài? Sau khi nộp, bạn không thể sửa câu trả lời.")
      ) {
        return;
      }

      clearTimeout(state.submitRetryTimerId);
      state.submitRetryTimerId = null;
      state.pendingSubmission = {
        autoSubmitted: Boolean(autoSubmitted),
        terminationReason
      };
      state.submitting = true;
      submitButton.disabled = true;
      submitButton.textContent = "Đang nộp bài...";
      clearInterval(state.timerId);
      clearInterval(state.tabTimerId);
      clearInterval(state.inactivityTimerId);
      clearTimeout(state.progressSaveTimerId);
      clearInterval(state.progressSyncTimerId);
      tabOverlay.hidden = true;
      saveSession();

      try {
        const data = await callApi("submitAttempt", {
          attemptToken: state.token,
          email: state.email,
          deviceId: state.deviceId,
          answers: state.answers,
          autoSubmitted: Boolean(autoSubmitted),
          answerVersion: ++state.answerVersion,
          terminationReason,
          tabViolations: state.tabViolations
        });
        if(epoch!==state.authEpoch)return;
        state.active = false;
        state.pendingSubmission = null;
        state.submitRetryCount = 0;
        state.submitFailureNotified = false;
        clearSession();
        renderResult(data);
      } catch (error) {
        if(epoch!==state.authEpoch)return;
        state.submitting = false;
        if (error.isTransportError) {
          state.submitRetryCount += 1;
          const retryDelay = Math.min(
            30000,
            3000 * Math.pow(2, Math.min(state.submitRetryCount - 1, 3))
          ) + Math.floor(Math.random() * 1500);
          submitButton.disabled = true;
          submitButton.textContent = navigator.onLine
            ? "Mất kết nối - đang gửi lại..."
            : "Đang chờ có mạng để nộp bài...";
          saveSession();
          state.submitRetryTimerId = window.setTimeout(() => {
            if (!state.pendingSubmission || !state.active) return;
            state.submitting = false;
            submitExam(
              state.pendingSubmission.autoSubmitted,
              state.pendingSubmission.terminationReason,
              true
            );
          }, retryDelay);
          if (!state.submitFailureNotified) {
            state.submitFailureNotified = true;
            window.alert(
              "Kết nối với hệ thống đang bị gián đoạn. Bài làm đã được giữ trên thiết bị và sẽ tự động gửi lại; vui lòng không đóng trang này."
            );
          }
          state.submitting = true;
          return;
        }

        state.pendingSubmission = null;
        state.submitRetryCount = 0;
        state.submitFailureNotified = false;
        state.hiddenAt = 0;
        state.attentionReason = "";
        state.lastInteractionAt = Date.now();
        submitButton.disabled = false;
        submitButton.textContent = "Nộp bài";
        startTimer();
        startInactivityWatcher();
        startProgressSync();
        window.alert(error.message);
      }
    }

      "#f56b1f",
      "#16865a",

    function normalizeCategoryStats(data) {
      const source = Array.isArray(data.categoryStats) && data.categoryStats.length
        ? data.categoryStats
        : [{
            category: "Tổng quan",
            correct: Number(data.score || 0),
            total: Number(data.total || 0),
            percent: Number(data.percent || 0)
          }];

      return source.map((item, index) => {
        const total = Math.max(0, Number(item.total || 0));
        const correct = Math.max(0, Math.min(total, Number(item.correct || 0)));
        const category = String(item.category || "").trim();
        return {
          category: category || `Phần ${index + 1}`,
          label: category ? `Phần ${index + 1}: ${category}` : `Phần ${index + 1}`,
          correct,
          total,
          percent: total ? Math.round((correct / total) * 100) : 0,
          color: CATEGORY_COLORS[index % CATEGORY_COLORS.length]
        };
      });
    }

    function buildCategoryRing(stats) {
      const totalQuestions = stats.reduce((sum, item) => sum + item.total, 0);
      if (!totalQuestions) return "conic-gradient(#e8edf1 0deg 360deg)";

      const stops = [];
      let cursor = 0;
      stats.forEach((item) => {
        const span = (item.total / totalQuestions) * 360;
        const end = cursor + span;
        const separator = Math.min(1.2, span * 0.08);
        const contentEnd = Math.max(cursor, end - separator);
        const correctEnd = cursor + ((contentEnd - cursor) * item.percent / 100);

        if (correctEnd > cursor) {
          stops.push(`${item.color} ${cursor.toFixed(2)}deg ${correctEnd.toFixed(2)}deg`);
        }
        if (contentEnd > correctEnd) {
          stops.push(`#e8edf1 ${correctEnd.toFixed(2)}deg ${contentEnd.toFixed(2)}deg`);
        }
        if (end > contentEnd) {
          stops.push(`#ffffff ${contentEnd.toFixed(2)}deg ${end.toFixed(2)}deg`);
        }
        cursor = end;
      });
      return `conic-gradient(${stops.join(", ")})`;
    }

    async function returnToCourseSelection() {
      const previousEmail = state.email;
      resetExamState();
      courseMessage.textContent = "";
      Portal.loading('Đang cập nhật khóa học và lượt thi…');
      try {
        await authenticateParticipant(previousEmail,true);
      } catch (error) {
        if(Portal.isAuthError(error)){handleParticipantAuthLoss(error);return;}
        Portal.recovery(error.message,returnToCourseSelection);
      }
    }

    function logoutParticipant() {
      if(state.active){window.alert('Hãy nộp bài trước khi đăng xuất.');return;}
      window.LearningPortal?.close();
      const previousEmail = state.email;
      callApi("logoutParticipant",{deviceId:state.deviceId}).catch(()=>{});
      Portal.session("");
      state.authEpoch++;resetExamState(false);
      state.email = "";
      state.participant = null;
      state.courses = [];
      courseView.hidden = true;
      loginView.hidden = false;
      emailInput.value = previousEmail;
      loginForm.reset();emailInput.value=previousEmail;document.getElementById('deviceVerification').hidden=true;
      setLoginLoading(false);
      showLoginForm();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleParticipantAuthLoss(error,clearToken=true){
      window.LearningPortal?.close();
      if(state.active)saveSession();
      state.authEpoch++;resetExamState(false);state.participant=null;state.courses=[];
      if(clearToken)Portal.session('');loginForm.reset();document.getElementById('deviceVerification').hidden=true;
      document.getElementById('passwordSetupForm').reset();showLoginForm();setLoginLoading(false);loginMessage.textContent=error.message;
    }
    document.addEventListener('portal:logout',event=>handleParticipantAuthLoss(new Error(event.detail.message),false));

    function startTabCountdown() {
      clearInterval(state.tabTimerId);
      const update = () => {
        if (!state.hiddenAt || !state.active) return;
        const elapsed = Math.floor((Date.now() - state.hiddenAt) / 1000);
        const graceSeconds = state.attentionReason === "INACTIVITY"
          ? INACTIVITY_GRACE_SECONDS
          : TAB_GRACE_SECONDS;
        const left = graceSeconds - elapsed;
        tabCountdown.textContent = Math.max(0, left);
        if (left <= 0) {
          clearInterval(state.tabTimerId);
          submitExam(true, getAttentionTerminationReason());
        }
      };
      update();
      state.tabTimerId = setInterval(update, 1000);
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if(loginButton.disabled)return;
      loginMessage.textContent = "";
      if (!emailInput.checkValidity()) {
        emailInput.reportValidity();
        return;
      }
      if(!document.getElementById('learnerPassword').reportValidity())return;

      setLoginLoading(true);
      let epoch;
      try {
        const email=emailInput.value.trim();
        const password=document.getElementById('learnerPassword').value;
        epoch=state.authEpoch;
        if(document.getElementById('deviceVerification').hidden && !window.portalViewingLearner){
          let admin;
          try{
            admin=await Portal.request(APPS_SCRIPT_URL,'loginAdmin',{email,password});
          }catch(error){
            if(error.message!=='Email này không có quyền quản trị hoặc đã bị khóa.')throw error;
          }
          if(epoch!==state.authEpoch)return;
          if(admin?.ok&&admin.adminToken){
            document.getElementById('learnerPassword').value='';
            sessionStorage.setItem('sungrow_admin_session_v1',admin.adminToken);
            window.openPortalWorkspace('admin');
            return;
          }
        }
        const login=authenticateParticipant(email);epoch=state.authEpoch;await login;
      } catch (error) {
        if(epoch!==state.authEpoch)return;
        if(Portal.isAuthError(error))handleParticipantAuthLoss(error);
        else if(!document.getElementById('bootView').hidden)Portal.recovery(error.message,initialize);
        else loginMessage.textContent = error.message;
      } finally {
        if(epoch===state.authEpoch)setLoginLoading(false);
      }
    });

    state.answerVersion = 0;
    state.serverOffset = 0;
    function passwordSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(16)));}
    const setupForm=document.getElementById('passwordSetupForm'),setupMessage=document.getElementById('setupMessage');
    document.getElementById('passwordSetupToggle').addEventListener('click',()=>{loginContent.hidden=true;registrationForm.hidden=true;setupForm.hidden=false;document.getElementById('setupEmail').value=emailInput.value;});
    document.getElementById('setupBack').addEventListener('click',()=>{setupForm.hidden=true;showLoginForm();});
    document.getElementById('setupSendOtp').addEventListener('click',async()=>{
      const field=document.getElementById('setupEmail'),button=document.getElementById('setupSendOtp');
      if(!field.reportValidity())return;button.disabled=true;
      try{const result=await callApi('sendParticipantOtp',{email:field.value.trim(),deviceId:state.deviceId,purpose:'password'});setupMessage.textContent=result.message;
        let left=60;const tick=()=>{button.textContent=left?`Gửi lại sau ${left}s`:'Gửi mã xác thực';};tick();const timer=setInterval(()=>{left--;tick();if(!left){clearInterval(timer);button.disabled=false;}},1000);
      }catch(error){setupMessage.textContent=error.message;button.disabled=false;}
    });
    setupForm.addEventListener('submit',async event=>{
      event.preventDefault();if(!setupForm.reportValidity())return;
      const password=document.getElementById('setupPassword').value;
      if(password!==document.getElementById('setupConfirm').value){setupMessage.textContent='Mật khẩu nhập lại không khớp.';return;}
      const button=setupForm.querySelector('[type=submit]');button.disabled=true;
      try{const result=await callApi('setParticipantPassword',{email:document.getElementById('setupEmail').value.trim(),deviceId:state.deviceId,password,passwordSalt:passwordSalt(),otp:document.getElementById('setupOtp').value.trim()});
        Portal.session('');emailInput.value=document.getElementById('setupEmail').value;setupForm.reset();setupForm.hidden=true;showLoginForm();loginMessage.textContent=result.message;
      }catch(error){setupMessage.textContent=error.message;}finally{button.disabled=false;}
    });
    emailInput.addEventListener('input',()=>{document.getElementById('deviceVerification').hidden=true;document.getElementById('learnerOtp').value='';document.getElementById('confirmTransfer').checked=false;});
    document.getElementById("learnerOtpButton").addEventListener("click", async () => {
      if (!emailInput.checkValidity()) { emailInput.reportValidity(); return; }
      const button=document.getElementById("learnerOtpButton");button.disabled=true;
      try {
        const result=await callApi("sendParticipantOtp",{email:emailInput.value.trim(),deviceId:state.deviceId,purpose:'device',password:document.getElementById('learnerPassword').value});
        loginMessage.textContent=result.message;
        let left=60;button.textContent=`Gửi lại sau ${left}s`;
        const timer=setInterval(()=>{left--;button.textContent=left?`Gửi lại sau ${left}s`:"Gửi mã đăng nhập";if(!left){clearInterval(timer);button.disabled=false;}},1000);
      } catch(error) {loginMessage.textContent=error.message;button.disabled=false;}
    });
    document.getElementById("adminNavLink").addEventListener("click",event=>{
      if(state.active){event.preventDefault();window.alert("Hãy nộp bài trước khi chuyển sang quản trị.");}
    });
    // Send minimal attention events; the server measures the elapsed interval.
    let attentionChain=Promise.resolve();
    function reportAttention(attention) {
      if(!state.active || state.submitting)return;
      const payload={attemptToken:state.token,email:state.email,deviceId:state.deviceId,attention};
      attentionChain=attentionChain.catch(()=>{}).then(()=>callApi("reportAttention",payload)).then(data=>{
        if(data.finished && state.active && !state.submitting)submitExam(true,"TAB_TIMEOUT");
      }).catch(()=>{});
    }
    document.addEventListener("visibilitychange",()=>reportAttention(document.hidden?"away":"present"));
    window.addEventListener("blur",()=>reportAttention("away"));
    window.addEventListener("focus",()=>{if(!document.hidden)reportAttention("present");});
    registrationToggleButton.addEventListener("click", showRegistrationForm);
    registrationBackButton.addEventListener("click", showLoginForm);
    registrationOtpButton.addEventListener("click", sendRegistrationOtp);
    logoutButton.addEventListener("click", logoutParticipant);
    violationAcknowledgeButton.addEventListener("click", () => {
      violationWarningOverlay.hidden = true;
      state.lastInteractionAt = Date.now();
    });

    courseGrid.addEventListener("click", async (event) => {
      const resultButton = event.target.closest("[data-result-course-id]");
      if (resultButton) {
        courseMessage.textContent = "";
        resultButton.disabled = true;
        const previousText = resultButton.textContent;
        resultButton.textContent = "Đang tải kết quả...";
        try {
          await viewLatestResult(resultButton.dataset.resultCourseId);
        } catch (error) {
          courseMessage.textContent = error.message;
          resultButton.disabled = false;
          resultButton.textContent = previousText;
        }
        return;
      }

      const button = event.target.closest("[data-start-course-id]");
      if (!button || button.disabled) return;
      if(state.startingAttempt)return;
      const epoch=state.authEpoch;
      state.startingAttempt=true;
      const controls=Array.from(courseGrid.querySelectorAll('button')).map(control=>({control,disabled:control.disabled}));
      controls.forEach(({control})=>control.disabled=true);
      courseMessage.textContent = "Đang yêu cầu máy chủ tạo đề. Nếu chưa có xác nhận, hệ thống sẽ dừng chờ và cho phép kiểm tra lại cùng mã yêu cầu.";
      const previousText = button.textContent;
      button.textContent = "Đang tạo đề...";
      const started=Date.now();
      const loadingTimer=setInterval(()=>{button.textContent=`Đang chờ máy chủ · ${Math.floor((Date.now()-started)/1000)}s`;},1000);
      try {
        await startAttempt(state.email, button.dataset.startCourseId);
      } catch (error) {
        if(epoch!==state.authEpoch)return;
        courseMessage.textContent = error.message;
        button.textContent = error.uncertain?"Kiểm tra lại yêu cầu":previousText;
      } finally {
        clearInterval(loadingTimer);if(epoch!==state.authEpoch)return;state.startingAttempt=false;
        controls.forEach(({control,disabled})=>control.disabled=disabled);
        if(!button.textContent.includes('Kiểm tra lại'))button.textContent=previousText;
      }
    });

    registrationEmail.addEventListener("input", () => {
      if (!registrationOtpSent) return;
      resetRegistrationOtp();
      registrationMessage.classList.remove("success");
      registrationMessage.textContent = "Email đã thay đổi. Vui lòng gửi lại mã OTP.";
    });

    registrationOtp.addEventListener("input", () => {
      registrationOtp.value = registrationOtp.value.replace(/\D/g, "").slice(0, 8);
    });

    registrationForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      registrationMessage.textContent = "";
      registrationMessage.classList.remove("success");
      const fields = [
        registrationName,
        registrationCompany,
        registrationEmail,
        registrationOtp,document.getElementById('registrationPassword'),document.getElementById('registrationConfirm')
      ];
      const invalidField = fields.find((field) => !field.checkValidity());
      if (invalidField) {
        invalidField.reportValidity();
        invalidField.focus();
        return;
      }
      if (!registrationOtpSent) {
        registrationMessage.textContent = "Vui lòng gửi và nhập mã OTP trước khi đăng ký.";
        registrationOtpButton.focus();
        return;
      }

      if(document.getElementById('registrationPassword').value!==document.getElementById('registrationConfirm').value){registrationMessage.textContent='Mật khẩu nhập lại không khớp.';return;}

      setRegistrationLoading(true);
      try {
        await registerParticipant();
      } catch (error) {
        registrationMessage.textContent = error.message;
      } finally {
        if (!registrationRedirectTimer) {
          setRegistrationLoading(false);
        }
      }
    });

    quizForm.addEventListener("change", (event) => {
      if (!state.active || !['radio','checkbox'].includes(event.target.type)) return;
      if (event.target.type === 'checkbox') {
        const values = [...quizForm.querySelectorAll('input[type=checkbox]:checked')].filter(input=>input.name===event.target.name).map(input=>input.value);
        if (values.length) state.answers[event.target.name]=values; else delete state.answers[event.target.name];
      } else state.answers[event.target.name]=event.target.value;
      saveSession();
      updateProgress();
      scheduleProgressSave();
    });

    questionNavGrid.addEventListener("click", (event) => {
      const button = event.target.closest(".question-nav-button");
      if (!button) return;
      openExamQuestion(Number(button.dataset.questionNumber),true);
    });
    document.getElementById('previousQuestion').addEventListener('click',()=>openExamQuestion(state.currentQuestion-1,true));
    document.getElementById('nextQuestion').addEventListener('click',()=>openExamQuestion(state.currentQuestion+1,true));

    resultView.addEventListener("click", (event) => {
      const historyButton = event.target.closest("[data-history-token]");
      if (historyButton && historyButton.dataset.historyToken) {
        const previousText = historyButton.innerHTML;
        historyButton.disabled = true;
        viewAttemptResult(historyButton.dataset.historyToken)
          .catch((error) => {
            historyButton.disabled = false;
            historyButton.innerHTML = previousText;
            window.alert(error.message);
          });
        return;
      }
      const button = event.target.closest('[data-action="restart-exam"]');
      if (button) returnToCourseSelection();
    });

    backToTopButton.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    window.addEventListener("scroll", () => {
      backToTopButton.hidden = window.scrollY < 420;
    }, { passive: true });

    submitButton.addEventListener("click", () => window.v3Review());

    function getAttentionTerminationReason() {
      if (state.attentionReason === "INACTIVITY") return "INACTIVITY_TIMEOUT";
      if (state.attentionReason === "WINDOW_BLUR") return "APP_TIMEOUT";
      return "TAB_TIMEOUT";
    }

    function updateAttentionMessage(reason) {
      const inactivity = reason === "INACTIVITY";
      attentionEyebrow.textContent = inactivity ? "Cảnh báo không hoạt động" : "Cảnh báo rời bài thi";
      attentionTitle.textContent = inactivity ? "Vui lòng tiếp tục làm bài" : "Vui lòng quay lại bài kiểm tra";
      attentionMessage.textContent = inactivity
        ? "Không phát hiện thao tác trong 5 phút. Bài sẽ tự động kết thúc nếu bạn không tiếp tục trong 60 giây."
        : "Bài sẽ tự động kết thúc nếu bạn rời tab hoặc chuyển sang ứng dụng khác quá 60 giây.";
    }

    function beginAwayCountdown(reason) {
      if (!state.active || state.submitting) return;
      const previousReason = state.attentionReason;
      if (!state.hiddenAt) {
        state.hiddenAt = Date.now();
        if (reason !== "INACTIVITY") state.tabViolations += 1;
      } else if (previousReason === "INACTIVITY" && reason !== "INACTIVITY") {
        state.tabViolations += 1;
      }
      if (!previousReason || reason === "TAB_HIDDEN" || previousReason === "INACTIVITY") {
        state.attentionReason = reason;
      }
      updateAttentionMessage(state.attentionReason);
      saveSession();
      tabOverlay.hidden = false;
      startTabCountdown();
    }

    function returnFromAway() {
      if (!state.active || state.submitting || document.hidden) return;
      if (state.attentionReason === "INACTIVITY") return;
      clearInterval(state.tabTimerId);
      const elapsed = state.hiddenAt ? Date.now() - state.hiddenAt : 0;
      if (elapsed >= TAB_GRACE_SECONDS * 1000) {
        submitExam(true, getAttentionTerminationReason());
        return;
      }
      state.hiddenAt = 0;
      state.attentionReason = "";
      state.lastInteractionAt = Date.now();
      saveSession();
      tabOverlay.hidden = true;
      showTabViolationWarningIfNeeded();
    }

    function showTabViolationWarningIfNeeded() {
      if (
        !state.active ||
        state.submitting ||
        state.tabViolations < TAB_WARNING_THRESHOLD ||
        state.tabWarningShown
      ) return;
      state.tabWarningShown = true;
      violationWarningCount.textContent = state.tabViolations;
      saveSession();
      violationWarningOverlay.hidden = false;
    }

    function markExamActivity() {
      if (!state.active || state.submitting || document.hidden) return;
      state.lastInteractionAt = Date.now();
      if (state.attentionReason !== "INACTIVITY") return;
      clearInterval(state.tabTimerId);
      state.hiddenAt = 0;
      state.attentionReason = "";
      saveSession();
      tabOverlay.hidden = true;
    }

    function startInactivityWatcher() {
      clearInterval(state.inactivityTimerId);
      state.lastInteractionAt = Date.now();
      state.inactivityTimerId = setInterval(() => {
        if (
          !state.active ||
          state.submitting ||
          state.hiddenAt ||
          document.hidden ||
          !document.hasFocus()
        ) return;
        if (Date.now() - state.lastInteractionAt >= INACTIVITY_TRIGGER_SECONDS * 1000) {
          beginAwayCountdown("INACTIVITY");
        }
      }, 1000);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        saveAttemptProgress(true);
        beginAwayCountdown("TAB_HIDDEN");
        return;
      }
      if (document.hasFocus()) {
        returnFromAway();
      }
    });

    window.addEventListener("blur", () => {
      beginAwayCountdown(document.hidden ? "TAB_HIDDEN" : "WINDOW_BLUR");
    });

    window.addEventListener("focus", () => {
      returnFromAway();
    });

    ["pointerdown", "pointermove", "keydown", "touchstart", "change"].forEach((eventName) => {
      document.addEventListener(eventName, markExamActivity, { passive: true, capture: true });
    });

    window.addEventListener("scroll", markExamActivity, { passive: true });

    window.addEventListener("keydown", (event) => {
      const reloadShortcut = event.key === "F5" || ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "r");
      if (!reloadShortcut || !state.active || state.submitting) return;
      event.preventDefault();
      const accepted = window.confirm(
        "Nếu tải lại trang, dữ liệu bài làm hiện tại sẽ được nộp và lượt thi này vẫn được tính. Bạn có chắc chắn muốn tải lại không?"
      );
      if (!accepted) return;
      confirmedPageReload = true;
      window.location.reload();
    });

    window.addEventListener("beforeunload", (event) => {
      if (!state.active || confirmedPageReload) return;
      event.preventDefault();
      event.returnValue = "";
    });

    window.addEventListener("online", () => {
      if (!state.active || !state.pendingSubmission) return;
      clearTimeout(state.submitRetryTimerId);
      state.submitRetryTimerId = null;
      state.submitting = false;
      submitExam(
        state.pendingSubmission.autoSubmitted,
        state.pendingSubmission.terminationReason,
        true
      );
    });

    let initializing=false;
    async function initialize(){
      if(initializing)return;initializing=true;Portal.loading();
      let epoch=state.authEpoch;
      try{
        if(Portal.session()){
          const restore=authenticateParticipant('',true);epoch=state.authEpoch;await restore;
        }else{
          const config=await callApi('getPublicConfig',{});
          state.learningReady=config.learningReady===true;
          document.getElementById('learningPortal').hidden=!state.learningReady;
          document.getElementById('academyNavigation').hidden=!state.learningReady;
          if(epoch!==state.authEpoch)return;
          if(config.authSchema!==3||!config.ready){Portal.recovery('Hệ thống cần quản trị cập nhật Apps Script và chạy setupPlatformV2.',initialize);return;}
          showLoginForm();setLoginLoading(false);
          if(localStorage.getItem(ACTIVE_SESSION_KEY))loginMessage.textContent='Có bài làm chưa được xác nhận. Đăng nhập lại để xác nhận kết quả; dữ liệu vẫn được giữ trên trình duyệt.';
        }
      }catch(error){
        if(epoch!==state.authEpoch)return;
        if(Portal.isAuthError(error))handleParticipantAuthLoss(error);
        else Portal.recovery(error.message||'Chưa thể kết nối máy chủ. Phiên và bài làm vẫn được giữ.',initialize);
      }finally{initializing=false;setLoginLoading(false);}
    }
    window.addEventListener('pageshow',event=>{if(event.persisted){if(state.active)saveSession();resetExamState(false);initialize();}});
    document.addEventListener('DOMContentLoaded', initialize, {once:true});
</script>
  <section id="learningCertificate" aria-label="Chứng nhận"></section>
  <script>(() => {
  const learner = document.getElementById('learningPortal');
