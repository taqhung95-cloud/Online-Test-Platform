    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[char]);

  function wireForm(form, run, status) {
    form.onsubmit = async event => {
      event.preventDefault();
      const button = form.querySelector('[type=submit]');
      button.disabled = true;
      status.textContent = 'Đang lưu…';
      try {
        await run(Object.fromEntries(new FormData(form)), form);
        status.textContent = 'Đã lưu.';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    };
  }

  if (learner) {
    const navigation = document.getElementById('academyNavigation');
    const content = learner.querySelector('.learning-content');
    const status = learner.querySelector('[role=status]');
    const exams = document.getElementById('learningExams');
    let generation = 0;
    let active = 'overview';
    let home;
    let selectedCourse = '';
    function catalog(title, items, filterLabel, options, card) {
      content.innerHTML = `<h2>${title}</h2><div class="catalog-tools">
        <label>Tìm theo tên<input type="search" id="catalogSearch"></label>
        <label>${filterLabel}<select id="catalogFilter"><option value="">Tất cả</option>${options}</select></label>
        </div><p class="catalog-count" role="status"></p><div class="catalog-grid"></div>
        <nav class="catalog-pages" aria-label="Phân trang"></nav>`;
      const search = content.querySelector('#catalogSearch');
      const filter = content.querySelector('#catalogFilter');
      const grid = content.querySelector('.catalog-grid');
      const pages = content.querySelector('.catalog-pages');
      const pageSize = title === 'Thư viện khóa học' ? Math.max(items.length, 1) : 12;
      function show(page = 0) {
        const query = search.value.trim().toLocaleLowerCase('vi');
        const matches = items.filter(item => item.title.toLocaleLowerCase('vi').includes(query) && (!filter.value || item.status === filter.value));
        const count = Math.ceil(matches.length / pageSize);
        grid.innerHTML = matches.slice(page * pageSize, (page + 1) * pageSize).map(card).join('');
        content.querySelector('.catalog-count').textContent = matches.length ? `${matches.length} mục` : 'Không có mục phù hợp.';
        pages.hidden = count <= 1;
        pages.innerHTML = count > 1 ? `<button class="button secondary-button" type="button" ${page ? '' : 'disabled'}>Trang trước</button><span>${page + 1} / ${count}</span><button class="button secondary-button" type="button" ${page + 1 < count ? '' : 'disabled'}>Trang sau</button>` : '';
        if (count > 1) {
          const [previous,next] = pages.querySelectorAll('button');
          previous.onclick = () => {show(page - 1); pages.querySelector('button:not(:disabled)')?.focus();};
          next.onclick = () => {show(page + 1); pages.querySelector('button:not(:disabled)')?.focus();};
        }
      }
      search.oninput = filter.onchange = () => show();
      show();
    }
    const request = (action, data = {}) => callApi(action, {...data, deviceId:state.deviceId});

      <button class="learning-row" type="button" data-result="${escape(item.id)}">
        <span><strong>${escape(item.title)}</strong><small>${escape(item.submittedAt)}</small></span>
        <span>${escape(item.score)}/${escape(item.total)} · ${item.result === 'PASS' ? 'Đạt' : 'Chưa đạt'}</span>
      </button>`).join('') : '<p>Chưa có kết quả đã nộp.</p>';

    function render() {
      if (active === 'overview') {
        const completed = home.courses.flatMap(course => course.lessons).filter(lesson => lesson.completed).length;
        const upcoming = state.courses.filter(course => course.windowStatus === 'UPCOMING' || course.canStart)
          .sort((a,b) => (Date.parse(a.canStart ? a.closesAt : a.opensAt) || Infinity) -
            (Date.parse(b.canStart ? b.closesAt : b.opensAt) || Infinity)).slice(0, 3);
        const activeCourses = home.courses.filter(course => course.lessons.some(lesson => !lesson.completed)).slice(0, 3);
        content.innerHTML = `<div class="v2-overview">
          <aside class="v2-profile" aria-label="Hồ sơ học viên">

  <script>(() => {
  const search = document.getElementById('examSearch');
  if (search) {
    const windowFilter = document.getElementById('examWindowFilter');
    const sort = document.getElementById('examSort');
    const grid = document.getElementById('courseGrid');
    function update() {
      const query = search.value.trim().toLocaleLowerCase('vi');
      const cards = [...grid.querySelectorAll('.course-card')];
      cards.sort((a,b) => {
        if (sort.value === 'start') return (Date.parse(a.dataset.opens) || Infinity) - (Date.parse(b.dataset.opens) || Infinity);
        if (sort.value === 'end') return (Date.parse(a.dataset.closes) || Infinity) - (Date.parse(b.dataset.closes) || Infinity);
        return Number(a.dataset.position)-Number(b.dataset.position);
      });
      let visible = 0;
      cards.forEach(card => {
        card.hidden = !card.textContent.toLocaleLowerCase('vi').includes(query) ||
          (windowFilter.value !== '' && windowFilter.value !== card.dataset.window);
        if (!card.hidden) visible++;
        grid.append(card);
      });
      document.getElementById('examNoMatches').hidden = !cards.length || visible > 0;
    }
    search.addEventListener('input', update);
    windowFilter.addEventListener('change', update);
    sort.addEventListener('change', update);
    window.updateExamFilters = update;
  }
  const adminNav = document.getElementById('v2AdminNav');
  if (adminNav) {

      open(adminNav.querySelector('button[aria-pressed=true]:not([hidden])') || adminNav.querySelector('button'));
    };
    open(adminNav.querySelector('button'));

 function formatMetadata(root) {
   const statusPattern=/^(Đạt|Chưa đạt|PASS|FAIL(?:ED)?)$/i;
   function badge(value) {
     const passed=/^(Đạt|PASS)$/i.test(value);
     const element=document.createElement('span');
     element.className='sg-status-badge '+(passed?'is-pass':'is-fail');
     element.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="'+(passed?'m3 8 3 3 7-7':'M4 4l8 8m0-8-8 8')+'"/></svg>';
     element.append(passed?'Đạt':'Chưa đạt');
     return element;
   }
   for(const element of $$('.v4-badge,.sg-result-status,.history-score .pass-text,.history-score .failed-text,.sg-score-summary .metric-value:is(.pass-text,.failed-text)',root)){
     const value=element.textContent.trim();
     if(!statusPattern.test(value))continue;
     const next=badge(value);
     if(element.classList.contains('sg-result-status'))next.classList.add('sg-result-status');
     if(element.classList.contains('metric-value'))next.classList.add('metric-value');
     element.replaceWith(next);
   }
   const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
   const matches=[];
   while(walker.nextNode()){
     const node=walker.currentNode;
     if(/\s+·\s+/.test(node.data)&&!node.parentElement.closest('script,style,textarea,svg'))matches.push(node);
   }
   for(const node of matches){
     const parts=node.data.trim().split(/\s+·\s+/);
     if(node.parentElement.closest('option')){
       node.data=parts.join(' (')+')'.repeat(parts.length-1);
       continue;
     }
     const group=document.createElement('span');group.className='sg-meta-items';
     for(const part of parts){
       if(group.childNodes.length)group.append(' ');
       if(statusPattern.test(part))group.append(badge(part));
       else{
         const item=document.createElement('span');
         item.textContent=part;group.append(item);
       }
     }
     node.replaceWith(group);
   }
   for(const row of $$('.v5-journey-list .learning-row',root)){
     if(row.classList.contains('sg-journey-row'))continue;
     row.classList.add('sg-journey-row');
   }
 }

/* Shared Liquid Glass surfaces for the learner and administrator shells. */
body.v5 {
  --sg-ink:#172b38;
  --sg-muted:#344f61;
  --sg-brand:#ff7900;
  --sg-action:#993d00;
  --sg-glass-base:#f3f8fb;
  --sg-glass-fill:#f5fbff8f;
  --sg-glass-nav:#f1faffaa;
  --sg-glass-popover:#f5fbffeb;
  --sg-glass-border:#ffffffed;
  --sg-glass-shadow:inset 0 1px 0 #fffffff2,0 2px 6px #23435e0b,0 12px 28px #23435e13;
  --sg-glass-radius:22px;
  --sg-glass-blur:14px;
  --sg-popover-blur:22px;
  --sg-input:#f6fafc;
  --sg-line:#c7d8e2;
  --sg-table-head:#deedf5;
  --sg-control-height:40px;
  --sg-control-radius:12px;
  --sg-type-compact:.8125rem;
  --sg-type-detail:.875rem;
  --sg-type-body:1rem;
  --sg-data-font:var(--sg-type-detail);
  --sg-page-background:
    radial-gradient(ellipse at 18% 8%,#c4def2,transparent 58%),
    radial-gradient(ellipse at 85% 2%,#ffe5cf,transparent 45%),
    radial-gradient(ellipse at 87% 92%,#bdddec,transparent 64%),
    #e8f2f8;
  color:var(--sg-ink);
  background:var(--sg-page-background);
}
body.v5.v4 :is(
  .v4-sidebar,.v4-mobile,.v4-focusbar,.panel,.card,.v2-task,.course-card,
  .v2-exam-tools,.catalog-toolbar,.exam-question-column,.v5-history-panel,
  .sg-result-head,.v2-metrics>div,.v2-banner,.learn-tools,.account-card
){
  background:var(--sg-glass-base);
  border-color:#d0dae7;
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  body.v5.v4 :is(
    .v4-sidebar,.v4-mobile,.v4-focusbar,.panel,.card,.v2-task,.course-card,
    .v2-exam-tools,.catalog-toolbar,.exam-question-column,.v5-history-panel,
    .sg-result-head,.v2-metrics>div,.v2-banner,.learn-tools,.account-card
  ){
    background:var(--sg-glass-fill);
    border-color:var(--sg-glass-border);
    box-shadow:var(--sg-glass-shadow);
    -webkit-backdrop-filter:blur(var(--sg-glass-blur)) saturate(125%);
    backdrop-filter:blur(var(--sg-glass-blur)) saturate(125%);
  }
  body.v5.v4 :is(.v4-sidebar,.v4-mobile,.v4-focusbar){background:var(--sg-glass-nav)}
  body.v5.v4 :is(.v4-scroll,.exam-question-column) .question-card{
    background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  body.v5.v4 dialog:not(.sg-certificate-dialog){
    background:var(--sg-glass-popover);
    border-color:#fff;
    box-shadow:var(--sg-glass-shadow),0 18px 60px #192c4a28;
    -webkit-backdrop-filter:blur(var(--sg-popover-blur)) saturate(125%);
    backdrop-filter:blur(var(--sg-popover-blur)) saturate(125%);
  }
}
@media(prefers-reduced-transparency:reduce){
  body.v5{
    --sg-glass-fill:#f8fafc;
    --sg-glass-nav:var(--sg-glass-base);
    --sg-glass-popover:var(--sg-glass-base);
    --sg-glass-blur:0px;
    --sg-popover-blur:0px;
    --sg-glass-border:#d0dae7;
    --sg-glass-shadow:0 2px 5px #283d5b13;
    --sg-page-background:#edf2fa;
    background:var(--sg-page-background);
  }
  body.v5.v4 :is(.v4-sidebar,.v4-mobile,.v4-focusbar,dialog:not(.sg-certificate-dialog)){background:#f8fafc}
  body.v5.v4 :is(.v4-sidebar,.v4-mobile,.v4-focusbar,.panel,.card,.v2-task,.course-card,.v2-exam-tools,.catalog-toolbar,.exam-question-column,.v5-history-panel,.sg-result-head,.v2-metrics>div,.v2-banner,.learn-tools,.account-card,dialog){
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
}
body.v5.v4 :is(.panel,.card,.course-card,.v2-task,.v2-metrics>div,.v2-banner,.sg-result-head,.account-card,dialog:not(.sg-certificate-dialog)){
  border-radius:var(--sg-glass-radius);
}

body.v5.v4 :is(.muted,.account-intro,.v4-company){color:var(--sg-muted)}

}

  padding:3px;
  border:1px solid var(--sg-line);
  border-radius:var(--sg-control-radius);
  background:var(--sg-glass-base);
}
@supports (backdrop-filter:blur(1px)) {
  body.v5.v4 :is(.v3-tabs,.tabs){background:var(--sg-glass-nav)}
}
body.v5.v4 :is(.v3-tabs,.tabs) [aria-selected=true]{

  box-shadow:inset 0 -2px var(--sg-brand);

  background-color:var(--sg-input);
  color:var(--sg-ink);
  border-color:var(--sg-line);
  border-radius:var(--sg-control-radius);
}
body.v5.v4 :is(.filters,.catalog-toolbar,.v2-exam-tools) :is(input,select,button:not(.v4-toggle)){
  min-block-size:var(--sg-control-height);

  font-size:var(--sg-data-font);

body.v5.v4 :is(.sg-table-scroll,.v5-panel-scroll,.v4-results,.overview-grid) thead,

}

html[data-solid-glass] body.v5{
  --sg-glass-fill:var(--sg-glass-base);
  --sg-glass-nav:var(--sg-glass-base);
  --sg-glass-popover:var(--sg-glass-base);
  --sg-glass-border:var(--sg-line);
  --sg-glass-blur:0px;
  --sg-popover-blur:0px;
  --sg-page-background:#e8f2f8;
  background:var(--sg-page-background);
}
@supports (backdrop-filter:blur(1px)) {
  body.v5.v4.learner-v2 #loginView:not([hidden]){
    background:var(--sg-glass-popover);
    backdrop-filter:blur(var(--sg-popover-blur)) saturate(125%);
  }
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  body.v5.v4 #resultView .sg-result-head,
  body.v5.v4 #learningExams .v2-exam-tools,
  body.v5.v4 #learningExams #courseGrid .course-card{
    background:var(--sg-glass-fill);
    border-color:var(--sg-glass-border);
    box-shadow:var(--sg-glass-shadow);
  }
}
.v5 .v4-toggle .v5-toggle-brand{display:none;width:24px;height:24px;object-fit:contain}
@media (min-width:721px) and (prefers-reduced-motion:no-preference){
  body.v5 .v4-shell{
    transition:grid-template-columns 240ms cubic-bezier(.2,.75,.25,1);
  }
  body.v5 .v4-sidebar{
    transition:padding 240ms cubic-bezier(.2,.75,.25,1);
  }
  body.v5 .v4-sidebar .v4-label{
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
}
.v5 .v4-toggle[aria-expanded="false"] .v5-toggle-brand{display:block;margin:auto}

/* Give the primary pane the space left over after sizing its companion. */
@media (min-width:1024px){
  body.v5 .v2-overview{
    grid-template-columns:minmax(0,1fr) clamp(16rem,23%,20rem);
  }
  body.v5 .v2-journey{
    align-self:start;
    height:auto;
    max-height:100%;
  }
}
@media (min-width:721px){
  body.v5 .v3-course-grid{
    grid-template-columns:minmax(0,1fr) clamp(17rem,32%,24rem);
  }
  body.v5 .result-layout.sg-result-layout{
    grid-template-columns:clamp(10rem,18%,14rem) minmax(0,1fr);
  }
  body.v5 .filters{
    grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr)) max-content;
  }
}
body.v5 .v2-tasks .v2-task-grid{
  grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));
}
body.v5 #learningExams #courseGrid.sg-exam-grid{
  grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));
}
body.v5 :is(.v2-task,.course-card,.catalog-card,.v2-journey,.v3-lessons,.filters)>*{
  min-inline-size:0;
}
body.v5 .filters :is(input,select){inline-size:100%;min-inline-size:0}

/* Apply single-line treatment to labels and compact titles, not reading content. */
body.v5 :is(.v4-label,.v2-chip,.exam-state,.sg-status-badge,.v4-stat-label),
body.v5 :is(.v3-tabs,.tabs) [role=tab],
body.v5 :is(.v2-task,.catalog-card,.course-actions,.sg-lesson-footer,.v5-head-actions) button{
  white-space:nowrap;
}
body.v5 :is(.v2-task strong,.v2-task small,.catalog-card h3,.exam-card-heading h3,.v5-journey-list strong){
  display:block;
  max-inline-size:100%;
  min-inline-size:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* Keep the navigation compact while making the brand easier to see. */
@media(min-width:721px){
  body.v5 .v4-shell{grid-template-columns:232px minmax(0,1fr)}
}
body.v5 .v4-sidebar{
  gap:18px;
  padding-inline:10px;
}
body.v5 .v5-sidehead{
  min-block-size:48px;
  gap:6px;
}
body.v5 .v4-sidebar .v4-logo{
  inline-size:174px;
  min-inline-size:0;
  block-size:auto;
}
body.v5 .v5-sidehead .v4-toggle{
  display:grid;
  place-items:center;
  inline-size:max-content;
  max-inline-size:100%;
  block-size:44px;
  min-block-size:44px;
  flex:0 1 auto;
  padding:0 6px;
  border:0;
  border-radius:10px;
  background:transparent;
  box-shadow:none;
}
body.v5 .v5-sidehead .v4-toggle:hover{background:#ff790015}
body.v5 .v4-sidebar .v4-toggle[aria-expanded="false"]{
  inline-size:48px;
  block-size:44px;
  flex-basis:48px;
}
body.v5 .v4-toggle .v5-toggle-brand{
  inline-size:38px;
  block-size:38px;
}
body.v5 .v4-sidebar nav button{
  min-block-size:44px;
  padding-inline:10px;
}
body.v5.v4-collapsed .v4-sidebar nav button{padding-inline:4px}
body.v5 .v4-sidebar nav{
  align-self:stretch;
  inline-size:100%;
  min-inline-size:0;
  max-inline-size:none;
  grid-template-columns:minmax(0,1fr);
  justify-items:stretch;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
body.v5 .v4-sidebar nav button{
  inline-size:100%;
  max-inline-size:100%;
  border-radius:10px;
}
body.v5 .v4-sidebar nav button[aria-current="page"]{
  background:#fff0e2;
  box-shadow:inset 0 0 0 1px #ff790033;
}
body.v5:not(.v4-collapsed) .v4-sidebar .v4-bottom,
body.v5 .v4-drawer .v4-sidebar .v4-bottom{
  padding:8px;
  border:1px solid #ffffffdb;
  border-radius:16px;
  background:var(--sg-glass-nav);
}
body.v5:not(.v4-collapsed) .v4-sidebar .v4-person,
body.v5 .v4-drawer .v4-sidebar .v4-person{
  border:0;
  padding:2px;
}
body.v5 .v4-bottom #logoutButton:hover{background:#fff0e2;color:var(--sg-action)}
body.v5 .v4-sidebar .v4-bottom{
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:4px;
}
body.v5 .v4-bottom :is(.v4-person,.v5-user-trigger,.v4-person>span:last-child){min-inline-size:0}
body.v5 .v4-person :is(.v4-name,.v4-company){
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
body.v5 .v4-sidebar .v4-bottom #logoutButton{
  display:grid;
  place-items:center;
  inline-size:40px;
  min-block-size:44px;
  padding:0;
  justify-self:end;
}
body.v5 .v4-bottom #logoutButton svg{inline-size:20px;block-size:20px}
body.v5.v4-collapsed .v4-sidebar .v4-bottom{
  grid-template-columns:minmax(0,1fr);
  justify-items:center;
}
body.v5.v4-collapsed .v4-sidebar .v4-bottom #logoutButton{justify-self:center}
body.v5.v4-collapsed .v4-drawer .v4-bottom{grid-template-columns:minmax(0,1fr) auto}
body.v5 .v4-drawer .v4-sidebar .v4-bottom .v4-person{display:flex!important}
body.v5 .v4-drawer .v5-sidehead .v4-toggle{
  inline-size:max-content;
  flex-basis:auto;
}
body.v5 .v4-drawer .v4-toggle .v5-toggle-brand{display:none}

/* Overview groups share one glass surface and softer edges. */
body.v5.v4 .v2-overview{
  position:relative;
  isolation:isolate;
  --sg-glass-border:#57778926;
  --sg-glass-shadow:0 5px 16px #23435e12;
  grid-template-rows:104px 84px minmax(0,1fr);
}
body.v5.v4 .v2-overview::before{
  content:"";
  position:absolute;
  inset:0;
  grid-area:1 / 1 / 3 / -1;
  z-index:0;
  pointer-events:none;
  border-radius:var(--sg-glass-radius);
  background:
    linear-gradient(105deg,#eef8fcda 0%,#e9f4f9ad 44%,#ecf6fb60 100%),
    url("v5-assets/6cb92bd0414e.png") right center / contain no-repeat,
    linear-gradient(110deg,#d8ecf8,#cbe7f7);
  filter:blur(2px);
  clip-path:inset(0 round var(--sg-glass-radius));
}
body.v5.v4 .v2-overview>:is(.v2-overview-banner,.v5-rail-wrap){
  position:relative;
  z-index:1;
}
body.v5.v4 .v2-overview :is(.v2-overview-banner,.v2-banner){
  background:transparent;
  border-color:transparent;
  box-shadow:none;
  backdrop-filter:none;
}
body.v5.v4 .v2-overview>.v5-rail-wrap{
  margin:0 16px 12px;
  min-inline-size:0;
}
body.v5.v4 .v2-overview .v2-metrics>div{
  border-color:transparent;
  box-shadow:none;
  background:var(--sg-glass-popover);
}
body.v5 .v2-tasks .v5-task-group{
  flex:0 0 auto;
  padding:16px;
}
body.v5 .v5-task-group-head{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-block-end:10px;
}
body.v5 .v5-task-group-head h3{margin:0}
body.v5 .v5-task-group .v2-task-grid{padding:0}
body.v5.v4 .v5-task-group .v2-task{
  display:grid;
  grid-template-rows:auto 1fr auto;
  align-items:start;
  border-color:transparent;
  box-shadow:none;
  background:#f1f8fc;
}
body.v5.v4 .v5-task-group .v2-task:hover{background:#fff5ea}
@media(min-width:1024px) and (max-height:850px){
  body.v5.v4 .v2-overview{grid-template-rows:92px 80px minmax(0,1fr)!important}
}
@media(max-width:1023px){
  body.v5.v4 .v2-overview{grid-template-rows:100px 88px auto auto!important}
}

body.v5.v4 .v2-overview .v2-banner{
  display:flex;
  align-items:center;
  position:relative;
  isolation:isolate;
  padding-inline:clamp(18px,3vw,42px);
}
body.v5.v4 .v2-overview .v2-overview-banner{align-self:stretch}
body.v5.v4 .v2-overview .v2-banner h2{font-size:clamp(1.25rem,2.1vw,2rem)}
.v5-current-course-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px 16px;
  margin-block-end:4px;
}
.v5-current-course-head p{margin-block-start:4px}
.v5-current-course-head button{white-space:nowrap}
body.v5 .v2-tasks .v5-task-group{
  display:flex;
  flex-direction:column;
  min-block-size:0;
}
body.v5 :is(.v5-task-group>h3,.v2-journey>h3,.v2-journey>button){flex:none}
body.v5 :is(.v5-task-group .v2-task-grid,.v2-journey .v5-journey-list){
  min-block-size:0;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-gutter:stable;
  scrollbar-color:auto;
  scrollbar-width:auto;
}
body.v5 .v5-task-group .v2-task-grid{
  flex:1 1 auto;
  align-content:start;
  grid-auto-rows:max-content;
  padding-inline-end:6px;
}
body.v5 :is(.v5-task-group .v2-task-grid,.v2-journey .v5-journey-list)::-webkit-scrollbar{width:10px}
body.v5 :is(.v5-task-group .v2-task-grid,.v2-journey .v5-journey-list)::-webkit-scrollbar-track{
  background:#57778915;
  border-radius:999px;
}
body.v5 :is(.v5-task-group .v2-task-grid,.v2-journey .v5-journey-list)::-webkit-scrollbar-thumb{
  background:#7d9bab;
  border:2px solid #e7f2f9;
  border-radius:999px;
}
body.v5 :is(.v5-task-group .v2-task-grid,.v2-journey .v5-journey-list)::-webkit-scrollbar-thumb:hover{background:#557887}
@media(min-width:1024px){
  body.v5 .v2-tasks{overflow:hidden;scrollbar-gutter:auto}
  body.v5 .v2-tasks .v5-task-group{flex:1 1 auto}
  body.v5 .v2-overview .v2-journey{height:100%;align-self:stretch}
}
@media(max-width:1023px){
  body.v5 .v5-task-group .v2-task-grid{max-block-size:17rem}
}

.v5-task-group{container-type:inline-size}
body.v5 .v5-task-group :is(.v2-task-grid,.v2-task){
  min-inline-size:0;
  max-inline-size:100%;
}
body.v5 .v2-tasks .v5-task-group .v2-task-grid{grid-template-columns:minmax(0,1fr)}
@container (min-width:32rem){
  body.v5 .v2-tasks .v5-task-group .v2-task-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container (min-width:46rem){
  body.v5 .v2-tasks .v5-task-group .v2-task-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
body.v5.v4 .v2-overview :is(
  .v2-banner h2,.v4-stat-label,.v2-task strong,.v2-task small,
  .v5-journey-list strong,.v5-journey-list small,.v5-current-course-head p,.v5-current-course>small
){
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;

  min-inline-size:0;
  max-inline-size:100%;
  max-block-size:2lh;
  overflow:hidden;
  white-space:normal;
  overflow-wrap:anywhere;
}
body.v5.v4 .v2-overview .v4-stat-label{line-height:1.3}
body.v5.v4 .v2-overview .v2-task small{margin:0}
body.v5 .v2-overview .v2-metrics strong{flex:none;white-space:nowrap}
body.v5 .v2-overview .v2-metrics>div{min-inline-size:0}
body.v5 .v5-current-course-head>div{flex:1 1 12rem;min-inline-size:0;max-inline-size:100%}
body.v5 .v5-current-course-head button{flex:none}
body.v5 .v2-overview .v5-overview-disclosure{
  flex:none;
  white-space:nowrap;
  margin-inline-start:auto;
  min-block-size:36px;
  padding:4px 8px;
  border:0;
  border-radius:var(--sg-control-radius);
  background:transparent;
  color:var(--sg-action);
  font:inherit;
  font-size:var(--sg-type-detail);
}
body.v5 .v2-overview .v5-overview-disclosure:hover{background:#fff5ea}

body.v5 .v5-library-panel{
  container-type:inline-size;
  display:flex;
  flex:1 1 auto;
  flex-direction:column;
  min-block-size:0;
  gap:14px;
  border-color:#57778926;
}
body.v5 .v5-library-panel>h2{flex:none}
body.v5.v4 .v5-library-panel .catalog-tools{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(10rem,15rem);
  align-items:end;
  flex:none;
  gap:8px 16px;
  margin:0;
  padding:0;
  border:0;
  background:none;
  box-shadow:none;
}
body.v5 .v5-library-panel .catalog-tools label{min-inline-size:0}
body.v5 .v5-library-panel .catalog-tools :is(input,select){
  min-block-size:40px;
  inline-size:100%;

  border:1px solid #9bb4c4;

body.v5 .v5-library-panel .catalog-count{flex:none}
body.v5 .v5-library-panel:has(.catalog-card) .catalog-count{
  position:absolute;
  inline-size:1px;
  block-size:1px;
  overflow:hidden;
  clip-path:inset(50%);
}
body.v5 .v5-library-panel .catalog-grid{
  display:grid;
  flex:1 1 auto;
  grid-template-columns:minmax(0,1fr)!important;
  grid-auto-rows:max-content;
  align-content:start;
  gap:12px;
  min-block-size:0;
  min-inline-size:0;
  block-size:auto!important;
  max-block-size:none;
  overflow:auto;
  scrollbar-gutter:stable;
  scrollbar-color:auto;
  scrollbar-width:auto;

}
@container (min-width:34rem){
  body.v5 .v5-library-panel .catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@media(min-width:1100px){
  @container (min-width:57rem){
    body.v5 .v5-library-panel .catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  }
}
body.v5.v4 .v5-library-panel .catalog-card{
  display:grid;
  grid-template-rows:auto auto auto auto 1fr auto;
  min-inline-size:0;
  max-inline-size:100%;
  gap:6px;
  padding:12px 14px;
  border-color:transparent;
  background:#f1f8fc;
  box-shadow:none;
}
body.v5 .v5-library-panel .catalog-card progress{
  block-size:8px;
  margin:2px 0;
}
body.v5.v4 .v5-library-panel .catalog-card:hover{background:#fff5ea}
body.v5 .v5-library-panel .catalog-card :is(h3,p){
  margin:0;
  white-space:normal;
  overflow-wrap:anywhere;
}
body.v5 .v5-library-panel .catalog-card h3{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  line-clamp:2;

  max-block-size:2lh;
  overflow:hidden;
}
body.v5 .v5-library-panel .catalog-card-end{

body.v5 .v5-library-panel .catalog-grid::-webkit-scrollbar{width:11px}
body.v5 .v5-library-panel .catalog-grid::-webkit-scrollbar-track{background:#57778926;border-radius:999px}
body.v5 .v5-library-panel .catalog-grid::-webkit-scrollbar-thumb{background:#6a8d9f;border:2px solid #e7f2f9;border-radius:999px}
body.v5 .v5-library-panel .catalog-grid::-webkit-scrollbar-thumb:hover{background:#4e7589}

body.v5 .v5-course-header{

  flex-wrap:wrap;
  gap:8px 16px;
  padding:12px 16px;
  border-radius:var(--sg-glass-radius);

}
body.v5 .v5-course-header .v5-title{flex:1 1 18rem}
body.v5 .v5-course-header h2{white-space:normal;overflow-wrap:anywhere}
body.v5 .v5-course-header .v5-head-actions{margin-inline-start:auto}
body.v5 .v5-course-header .v5-back{

  padding:6px 12px;
  border:1px solid var(--sg-line);
  border-radius:var(--sg-control-radius);

body.v5.v4 .v3-course-grid>section{border-color:#57778926}
body.v5 .v3-course-grid .v5-document-stage{
  display:grid;
  place-items:center;
  flex:1 1 auto;

}
body.v5 .v3-course-grid.v5-single-course{
  grid-template-columns:minmax(0,1fr) clamp(17rem,25%,21rem);
}
body.v5 .v5-course-header .v5-title{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px 12px;
}
.v5-course-type{
  flex:none;
  padding:3px 8px;

  height:auto;

  flex:0 1 auto;
  aspect-ratio:16/9;
  max-block-size:68dvh;
  border-radius:14px;

}
body.v5 .v5-single-course>section.v5-course-info{
  height:auto;
  align-self:start;
  gap:14px;
}
.v5-course-about{color:var(--sg-muted)}
.v5-course-state{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding-block-start:12px;
  border-block-start:1px solid var(--sg-line);
}
.v5-course-state>div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px}
.v5-course-state span{color:var(--sg-muted);font-size:var(--sg-type-compact)}
.v5-course-state span[data-course-done=true]{color:#185e46}
.v5-course-state progress{inline-size:100%}
.v5-course-actions{display:grid;gap:8px}
.v5-course-actions .button{text-align:center;text-decoration:none}
.v5-single-course .v4-exam-gate{margin-block-start:0}
.v5-document-controls{
  display:flex;
  flex:none;
  justify-content:center;
  align-items:center;
  gap:10px;
}
.v5-document-controls output{min-inline-size:6rem;text-align:center;color:var(--sg-muted)}
body.v5 .v5-document-controls button{
  inline-size:40px;
  min-block-size:40px;
  padding:0;
  font-size:1.25rem;
}
.v5-document-controls button[aria-disabled=true]{opacity:.45;cursor:default}

body.v5.v4 .v5-exam-panel{
  display:flex;
  flex:0 1 auto;

      return Object.keys(variables).reduce(
        (text, name) => text.replace(new RegExp(`\\{${name}\\}`, "g"), String(variables[name])),

    function localizeServerMessage(message) {
      const source = String(message || "");
      if (currentLanguage !== "en") return source;
      const exactMessages = {
        "Email quản trị không hợp lệ.": "The administrator email address is invalid.",
        "Email này không có quyền quản trị hoặc đã bị khóa.": "This email does not have administrator access or has been disabled.",

        "Phiên quản trị đã hết hạn. Vui lòng đăng nhập lại.": "The administrator session has expired. Please log in again."
      };
      if (exactMessages[source]) return exactMessages[source];
      let match = source.match(/^Tài khoản tạm khóa do nhập sai nhiều lần\. Vui lòng thử lại sau (\d+) phút\.$/);

      return source;

    async function loadDashboard(silent = false,restoring=false) {
      if (!adminToken) return;
      if (dashboardLoading&&dashboardRequestEpoch===adminEpoch) return;
      if (silent && Date.now() - lastDashboardLoadAt < 30000) return;
      dashboardLoading = true;
      const epoch=adminEpoch;dashboardRequestEpoch=epoch;
      if(restoring)Portal.loading('Đang xác thực phiên và tải dữ liệu quản trị…');
      if (!silent) {
        applyFilterButton.disabled = true;
        applyFilterButton.textContent = t("loading");
      }
      dashboardStatus.textContent = t("aggregating");
      try {
        const data = await callApi("getAdminDashboard", {
          adminToken,
          filters: currentFilters()
        });
        if(epoch!==adminEpoch)return;
        if(!data.metrics||!Array.isArray(data.rankings)||!Array.isArray(data.attempts))throw new Error('Dữ liệu quản trị chưa hợp lệ. Hãy thử tải lại dữ liệu.');
        renderFilterOptions(data.options || {});
        renderDashboard(data);
        dashboardData = data;lastDashboardLoadAt = Date.now();showDashboard(data.admin);
      } catch (error) {
        if(epoch!==adminEpoch)return;
        if (Portal.isAuthError(error)) {
          showLogin(localizeServerMessage(error.message));
          return;
        }
        if(!dashboardData)Portal.recovery(localizeServerMessage(error.message),()=>loadDashboard(false,true));
        else dashboardStatus.textContent = localizeServerMessage(error.message);

  let courses=[],loading=false,loadedAt=0;

  function selected(){return courses.find(c=>c.id===select.value);}
  function fill(){const c=selected();if(c){open.value=local(c.opensAt);close.value=local(c.closesAt);message.textContent='Trạng thái: '+({OPEN:'Đang mở',UPCOMING:'Chưa đến giờ',CLOSED:'Đã đóng',DISABLED:'Tạm khóa',INVALID:'Lịch không hợp lệ'}[c.windowStatus]||c.windowStatus);}}
  window.refreshCourseWindows=async(force=false)=>{
    if(!adminToken||loading||(!force&&Date.now()-loadedAt<60000))return;

      select.replaceChildren(...courses.map(c=>{const option=document.createElement('option');option.value=c.id;option.textContent=c.title;return option;}));

    }catch(e){message.textContent=e.message;}finally{loading=false;}
  };
  select.addEventListener('change',fill);
  document.getElementById('schedulePanel').addEventListener('toggle',()=>window.refreshCourseWindows(true));
  form.addEventListener('submit',async event=>{
    event.preventDefault();const course=selected();if(!course)return;
    const button=document.getElementById('scheduleSave');button.disabled=true;
    try{
      const opensAt=open.value?open.value+':00+07:00':'',closesAt=close.value?close.value+':00+07:00':'';
      if(opensAt&&closesAt&&Date.parse(opensAt)>=Date.parse(closesAt))throw Error('Giờ đóng phải sau giờ mở.');
      await callApi('updateCourseWindow',{adminToken,courseId:course.id,opensAt,closesAt,expectedUpdatedAt:course.updatedAt||''});
      await window.refreshCourseWindows(true);message.textContent='Đã lưu lịch. Thời gian được kiểm tra tại máy chủ.';
    }catch(e){message.textContent=e.message;}finally{button.disabled=false;}
  });
  document.getElementById('unlinkDeviceButton').addEventListener('click',async()=>{
    const email=window.prompt('Email tài khoản cần gỡ thiết bị (giữ nguyên lượt thi):');if(!email)return;
    if(!window.confirm('Thu hồi các phiên đăng nhập và gỡ liên kết thiết bị của '+email+'?'))return;
    try{const result=await callApi('unlinkParticipantDevice',{adminToken,email:email.trim()});message.textContent=result.message;}catch(error){message.textContent=error.message;}
  });
})();

  <script>(() => {
  const search = document.getElementById('examSearch');

    const windowFilter = document.getElementById('examWindowFilter');
    const sort = document.getElementById('examSort');
    const grid = document.getElementById('courseGrid');
    function update() {
      const query = search.value.trim().toLocaleLowerCase('vi');
      const cards = [...grid.querySelectorAll('.course-card')];
      cards.sort((a,b) => {
        if (sort.value === 'start') return (Date.parse(a.dataset.opens) || Infinity) - (Date.parse(b.dataset.opens) || Infinity);
        if (sort.value === 'end') return (Date.parse(a.dataset.closes) || Infinity) - (Date.parse(b.dataset.closes) || Infinity);
        return Number(a.dataset.position)-Number(b.dataset.position);
      });
      let visible = 0;
      cards.forEach(card => {
        card.hidden = !card.textContent.toLocaleLowerCase('vi').includes(query) ||
          (windowFilter.value !== '' && windowFilter.value !== card.dataset.window);
        if (!card.hidden) visible++;
        grid.append(card);
      });
      document.getElementById('examNoMatches').hidden = !cards.length || visible > 0;
    }
    search.addEventListener('input', update);
    windowFilter.addEventListener('change', update);
    sort.addEventListener('change', update);
    window.updateExamFilters = update;
  }
  const adminNav = document.getElementById('v2AdminNav');
  if (adminNav) {

      open(adminNav.querySelector('button[aria-pressed=true]:not([hidden])') || adminNav.querySelector('button'));
    };
    open(adminNav.querySelector('button'));
  }
})();

 function formatMetadata(root) {
   const statusPattern=/^(Đạt|Chưa đạt|PASS|FAIL(?:ED)?)$/i;
   function badge(value) {
     const passed=/^(Đạt|PASS)$/i.test(value);
     const element=document.createElement('span');
     element.className='sg-status-badge '+(passed?'is-pass':'is-fail');
     element.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="'+(passed?'m3 8 3 3 7-7':'M4 4l8 8m0-8-8 8')+'"/></svg>';
     element.append(passed?'Đạt':'Chưa đạt');
     return element;
   }
   for(const element of $$('.v4-badge,.sg-result-status,.history-score .pass-text,.history-score .failed-text,.sg-score-summary .metric-value:is(.pass-text,.failed-text)',root)){
     const value=element.textContent.trim();
     if(!statusPattern.test(value))continue;
     const next=badge(value);
     if(element.classList.contains('sg-result-status'))next.classList.add('sg-result-status');
     if(element.classList.contains('metric-value'))next.classList.add('metric-value');
     element.replaceWith(next);
   }
   const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
   const matches=[];
   while(walker.nextNode()){
     const node=walker.currentNode;
     if(/\s+·\s+/.test(node.data)&&!node.parentElement.closest('script,style,textarea,svg'))matches.push(node);
   }
   for(const node of matches){
     const parts=node.data.trim().split(/\s+·\s+/);
     if(node.parentElement.closest('option')){
       node.data=parts.join(' (')+')'.repeat(parts.length-1);
       continue;
     }
     const group=document.createElement('span');group.className='sg-meta-items';
     for(const part of parts){
       if(group.childNodes.length)group.append(' ');
       if(statusPattern.test(part))group.append(badge(part));
       else{
         const item=document.createElement('span');
         item.textContent=part;group.append(item);
       }
     }
     node.replaceWith(group);
   }
   for(const row of $$('.v5-journey-list .learning-row',root)){
     if(row.classList.contains('sg-journey-row'))continue;
     row.classList.add('sg-journey-row');
   }
 }

    const role = hasAdminSession && !learnerSelected ? 'admin' : 'learner';
    window.portalViewingLearner = hasAdminSession && learnerSelected;
    window.openPortalWorkspace = next => {
      sessionStorage.setItem(workspace, next === 'admin' ? 'admin' : 'learner');
      location.reload();
    };
    const layout = document.getElementById('portal-' + role + '-layout').content.cloneNode(true);
    const scripts = [...layout.querySelectorAll('script')];
    const slots = scripts.map(script => {
      const slot = document.createComment('portal script');
      script.replaceWith(slot);
      return slot;
    });
    document.body.className = role + '-v2';
    document.body.replaceChildren(layout);
    for (const [index, original] of scripts.entries()) {
      const script = document.createElement('script');
      script.textContent = original.textContent;
      slots[index].replaceWith(script);
    }
  })();
  </script>
</body>
</html>
